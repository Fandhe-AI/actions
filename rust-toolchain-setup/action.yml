name: Rust Toolchain Setup
description: >-
  runner の rustup を検証し、リポジトリの rust-toolchain.toml にツールチェーンを同期する。
  rustup 未導入・破損時は既定で fail-closed（allow-network-install で導入を opt-in できる）

inputs:
  components:
    description: >-
      追加でインストールする rustup コンポーネント（カンマ区切り。例: llvm-tools-preview）。
      rust-toolchain.toml の components に既に列挙済みのものは指定不要
    required: false
    default: ''
  allow-network-install:
    description: >-
      rustup が未導入・破損している場合に、ネットワークから rustup-init を取得して
      導入することを許可する（'true' で有効）。既定は 'false' = fail-closed。

      既定を fail-closed にしている理由: 導入は `curl https://sh.rustup.rs | sh` で行われ、
      action 自体を commit SHA で pin しても取得されるスクリプトの内容は固定・検証されない。
      永続 self-hosted runner の root ジョブ（Docker socket を持つ構成もある）で
      未 pin のリモートコードが実行される供給網経路（OWASP A08 相当）になるため、
      既定では踏まず、runner 側の不備として明示的に失敗させる。

      恒久対応は runner イメージへ rustup を焼き込むこと。使い捨ての GitHub ホストランナーや、
      供給網リスクを許容できる環境でのみ 'true' にする。
    required: false
    default: 'false'
  sanitize-github-extraheader:
    description: >-
      グローバル git config のうち **github.com 向けに実効値として適用される**
      `http.extraheader`（スコープ付き・host 非限定のどちらも対象）を、公開 repo
      （例: RustSec/advisory-db）への匿名 fetch へ、永続 self-hosted runner の
      ホスト側に残置した失効済み資格情報（stale credential）が混入して 401 に
      なるのを防ぐために無効化する（'true' で有効。既定 'true' = fail-closed で
      ガードを効かせる）。

      **runner ホストの実 global config ファイルは一切書き換えない。値そのものも
      本ステップの変数・コマンドライン引数・一時ファイルへは一度も現れない。**
      代わりに、元の global config を `[include]` で取り込んだ上で
      `http.https://github.com/.extraheader` を空値で上書きするだけの
      ジョブ専用の小さな「オーバーレイ」ファイルを `${RUNNER_TEMP}` 配下
      （パーミッション 600）に作成し、`GIT_CONFIG_GLOBAL` を `$GITHUB_ENV` 経由で
      当該オーバーレイに向けることで、本ジョブの以降のステップにのみ適用する。
      git の `http.extraHeader` は空値を与えるとそれより前に（include 経由も含め）
      累積された同一 URL 向けの値をすべてリセットする仕様であるため、スコープ付き
      （`http.https://github.com/.extraheader` 等）・host 非限定（`http.extraheader`、
      全ホスト対象）のどちらから累積された値も、元ファイルへ一切書き込まずに
      github.com 向けの実効値だけを無効化できる。他ホスト（private registry・
      別 Git サーバー等）向けの正当な認証ヘッダーは include 元の実ファイルを
      通じてそのまま有効なままであり、実ファイルからも消えないため、並行実行中の
      他ジョブや本ジョブ以外の用途を壊さない。`actions/checkout` が正当に書き込む
      リポジトリローカルの認証設定にも触れない。credential helper もオーバーレイ
      からは除去しない（`gh auth setup-git` 等の正当な用途があるため）。credential
      helper 由来の 401 が残る場合は、呼び出し側の該当コマンドに
      `GIT_CONFIG_GLOBAL=/dev/null` を環境変数として渡す回避策を検討すること。

      オーバーレイ作成後は `git config --file <オーバーレイ> --includes
      --get-urlmatch http.extraheader https://github.com/`（リポジトリローカル・
      system config は混ぜず、オーバーレイ経由の実効値のみを見る）で github.com
      向け実効値が残っていないことを検証し、残っていればジョブを失敗させる。

      根本原因（ホスト側の残置資格情報）の恒久対応は runner ホスト側で行う
      （本 input は CI 側の多層防御の 1 層であり、根本対応の代替ではない）。
      互換問題が起きた場合の escape hatch として 'false' で無効化できる
      （ただし無効化すると本 input が防ぐ 401 を再発させうる）。
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    # self-hosted runner のホスト側グローバル git 設定（例: /root/.gitconfig）に
    # 失効済みトークンの extraheader が残置されていると、後続の全 git fetch
    # （cargo audit / cargo deny 等が行う公開 repo advisory-db の匿名 fetch を含む）
    # に混入し、本来認証不要な公開 repo への fetch が 401 で失敗する
    # （2026-08-19 観測。runner 再割当で pass する flaky な症状として現れた）。
    # 恒久対応（ホスト側残置資格情報の除去）は runner ホスト側の別イシューのスコープ。
    #
    # 本ステップは runner ホストの実 global config ファイルを直接書き換えない。
    # 元の global config を [include] で取り込み、github.com 向け extraheader だけを
    # 空値で上書きする小さな「オーバーレイ」をジョブ専用に作成し、GIT_CONFIG_GLOBAL で
    # 以降のステップにのみ適用する。秘密値（extraheader の値そのもの）は、このステップの
    # どの変数・コマンドライン引数・一時ファイルにも一度も現れない（include 元ファイルへの
    # パスのみを扱う。パスは秘密情報ではない）。これにより、同一 self-hosted runner 上の
    # 並行プロセス・同一 UID のプロセスが /proc/<pid>/cmdline 等を読んでも資格情報が
    # 露出しない。リポジトリローカル config（actions/checkout が書き込む正当な認証設定）
    # には触れない。
    - name: Sanitize stale GitHub credentials in global git config
      env:
        SANITIZE: ${{ inputs.sanitize-github-extraheader }}
      shell: bash
      run: |
        set -euo pipefail

        # 'true'/'false' のみを明示的に受理する。typo・空白・大文字表記等の
        # 不正な値を「無効化」として黙って通すと fail-closed 設計が崩れるため、
        # 想定外の値はエラー終了とする。値そのものは workflow command 行へ
        # 混ぜない（改行や `::` を含む値による log/command 注入を避けるため）。
        case "${SANITIZE}" in
          true)
            ;;
          false)
            exit 0
            ;;
          *)
            echo "::error::sanitize-github-extraheader には 'true' または 'false' のみ指定できます"
            exit 1
            ;;
        esac

        # ガード対象となる「元の global config」ファイルを決定する。呼び出し側
        # ジョブが既に GIT_CONFIG_GLOBAL を設定済みであればそれを尊重する
        # （'/dev/null' はグローバル設定を意図的に無効化している状態であり、
        # ガード対象が存在しないため何もしない）。未設定なら git 自身の解決規則
        # （$HOME/.gitconfig を優先し、無ければ XDG パス）と同じ優先順位で
        # ファイルの存在を確認する。
        if [ -n "${GIT_CONFIG_GLOBAL:-}" ]; then
          if [ "${GIT_CONFIG_GLOBAL}" = "/dev/null" ]; then
            exit 0
          fi
          base_config="${GIT_CONFIG_GLOBAL}"
        elif [ -f "${HOME}/.gitconfig" ]; then
          base_config="${HOME}/.gitconfig"
        elif [ -f "${XDG_CONFIG_HOME:-${HOME}/.config}/git/config" ]; then
          base_config="${XDG_CONFIG_HOME:-${HOME}/.config}/git/config"
        else
          # グローバル git config が存在しない（stale credential もあり得ない）
          exit 0
        fi

        if [ ! -f "${base_config}" ]; then
          # 呼び出し側が指定した GIT_CONFIG_GLOBAL が指す先が未作成
          exit 0
        fi

        # 除去対象の有無を確認する。値そのものは一切出力しない。`--file` +
        # `--includes` で「実際に github.com への git 操作が見る実効値」（スコープ付き
        # extraheader・host 非限定 extraheader の両方を含む）を見る一方、リポジトリ
        # ローカル・system config は混ぜない（本ステップの実行時点で既に
        # actions/checkout 済みの場合、リポジトリローカルの正当な extraheader を
        # stale credential と誤認して fail-closed させないため）。
        #
        # exit code: 0 = 実効値あり, 1 = マッチ無し（正常系）, それ以外 = config
        # 破損等の実エラー。`|| true` で握り潰すと異常時に「値なし」と誤判定して
        # fail-open になるため、exit code を明示的に判定する。
        set +e
        remaining="$(git config --file "${base_config}" --includes --get-urlmatch http.extraheader https://github.com/ 2>/dev/null)"
        get_rc=$?
        set -e

        if [ "${get_rc}" -ne 0 ] && [ "${get_rc}" -ne 1 ]; then
          echo "::error::グローバル git config の読み取りに失敗しました。config が破損している可能性があります"
          exit 1
        fi

        if [ "${get_rc}" -ne 0 ] || [ -z "${remaining}" ]; then
          # github.com 向けの実効 extraheader が無い（stale credential なし）
          exit 0
        fi

        # ここから: 実 global config は一切書き換えず、ジョブ専用の「オーバーレイ」を
        # 作成する（$RUNNER_TEMP 配下、他ジョブ・他ユーザーから読めないよう
        # パーミッションを絞る）。オーバーレイは元の global config を [include] で
        # 取り込んだ上で、github.com 向け http.extraheader を空値で上書きする。
        # git の http.extraHeader は空値を与えると、それより前に（include 経由も
        # 含め）累積された同一 URL 向けの値をすべてリセットする仕様であるため、
        # スコープ付き・host 非限定のどちらから累積された値も、元ファイルへ一切
        # 書き込まずに github.com 向けの実効値だけを無効化できる（実測検証済み）。
        # include.path の値（ファイルパス）は秘密情報ではないため、コマンドライン
        # 引数として渡してよい。extraheader の値そのものはここでも一度も扱わない。
        tmp_dir="$(mktemp -d "${RUNNER_TEMP:-/tmp}/git-global-overlay.XXXXXX")"
        chmod 700 "${tmp_dir}"
        overlay="${tmp_dir}/gitconfig"
        : > "${overlay}"
        chmod 600 "${overlay}"

        if ! git config --file "${overlay}" --add -- include.path "${base_config}"; then
          echo "::error::グローバル git config のオーバーレイ作成に失敗しました（include.path の設定に失敗）"
          exit 1
        fi

        if ! git config --file "${overlay}" --add -- 'http.https://github.com/.extraheader' ""; then
          echo "::error::グローバル git config のオーバーレイ作成に失敗しました（extraheader のリセットに失敗）"
          exit 1
        fi

        echo "::notice::stale な可能性がある GitHub 資格情報を無効化するジョブ専用オーバーレイを適用しました（github.com 向け http.extraheader をリセット。runner ホストの実ファイルは変更していません）"

        # オーバーレイに対する検証（fail-closed）: github.com への実効 extraheader が
        # 本当に残っていないことを、実ファイルの読み取り時と同じ `--file` + `--includes`
        # 経路で確認する（リポジトリローカル・system config を混ぜない）。残っていれば
        # ガード失敗とする（黙って 401 を再発させない）。exit code の扱いは上記と同じ。
        set +e
        after="$(git config --file "${overlay}" --includes --get-urlmatch http.extraheader https://github.com/ 2>/dev/null)"
        after_rc=$?
        set -e

        if [ "${after_rc}" -ne 0 ] && [ "${after_rc}" -ne 1 ]; then
          echo "::error::除去後の検証で、オーバーレイの読み取りに失敗しました。config が破損している可能性があるためガードを失敗させます"
          exit 1
        fi

        if [ "${after_rc}" -eq 0 ] && [ -n "${after}" ]; then
          echo "::error::オーバーレイ適用後も github.com 向け extraheader が実効値として残存しています。ガードに失敗しました"
          exit 1
        fi

        # 以降のステップにのみオーバーレイを適用する（runner ホストの実 global
        # config はこの時点でも一切変更していない）。以降のステップは通常の git
        # コマンド経由でこのオーバーレイを読むため、include は自動的に処理され、
        # system・リポジトリローカルの正当な設定も通常どおりマージされる。
        echo "GIT_CONFIG_GLOBAL=${overlay}" >> "${GITHUB_ENV}"

    # 後続の「Sync toolchain」の前提（rustup show の実行可否）を満たしているか検証する。
    # 健全な導入済み環境では何もしない（冪等・追加コストほぼゼロ）。
    #
    # rustup が未導入・破損している場合の既定は **fail-closed**。ネットワークからの
    # 導入は allow-network-install: 'true' の明示的な opt-in が要る（input の説明を参照）。
    # 「runner に rustup が無い」は runner イメージ側の不備なので、ここで曖昧に
    # 取り繕わず、何が足りないかを明示して落とすほうが診断的にも安全上も良い
    # （黙って PATH だけ通して後続が exit 127 で落ちる、が従来の失敗モードだった）。
    #
    # 導入する場合、$GITHUB_PATH へ追記するのは `$HOME/.cargo/bin` 決め打ちではなく
    # `${CARGO_HOME:-$HOME/.cargo}/bin` であること。rustup-init は
    # **CARGO_HOME を尊重して**そこへ cargo/rustup 本体を配置するため、
    # CARGO_HOME を設定済みの runner（例: コンテナイメージ側で
    # `ENV CARGO_HOME=/opt/cargo` を持つ self-hosted runner）で決め打ちすると、
    # インストールは成功しているのに PATH に載るのが実在しない
    # `$HOME/.cargo/bin` になり、後続ステップが `cargo: command not found`
    # （exit 127）で落ちる。本ステップが緑のまま失敗するため原因究明も難しい。
    - name: Ensure rustup is available
      env:
        ALLOW_NETWORK_INSTALL: ${{ inputs.allow-network-install }}
      shell: bash
      run: |
        set -euo pipefail

        if command -v rustup >/dev/null 2>&1 && rustup --version >/dev/null 2>&1; then
          exit 0
        fi

        if [ "${ALLOW_NETWORK_INSTALL}" != "true" ]; then
          echo "::error::この runner に rustup がありません（未導入、または破損して実行できません）。"
          echo '::error::本アクションは既定で fail-closed です。ネットワークからの rustup 導入は'
          echo '::error::curl https://sh.rustup.rs | sh を伴い、pin できないリモートコードを'
          echo '::error::ジョブ権限で実行することになるため、既定では行いません。'
          echo "::error::恒久対応: runner イメージへ rustup を焼き込んでください。"
          echo "::error::どうしても runner 上で導入する場合は allow-network-install: 'true' を明示してください。"
          echo "診断情報:"
          echo "  RUSTUP_HOME=${RUSTUP_HOME:-<未設定>}"
          echo "  CARGO_HOME=${CARGO_HOME:-<未設定>}"
          echo "  PATH=${PATH}"
          exit 1
        fi

        echo "::warning::allow-network-install: 'true' のため、ネットワークから rustup を導入します（供給網リスクを許容した設定です）"
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none
        echo "${CARGO_HOME:-${HOME}/.cargo}/bin" >> "${GITHUB_PATH}"

    # rustup show はカレントディレクトリの rust-toolchain.toml を検出し、
    # 指定チャネル・components を未導入なら自動インストールする
    # （rust-toolchain.toml を単一真実源とするため、toolchain 指定 input は設けない）。
    - name: Sync toolchain (rust-toolchain.toml)
      shell: bash
      run: |
        set -euo pipefail
        rustup show

    # 呼び出し側ジョブ固有の追加コンポーネント（例: カバレッジ用 llvm-tools-preview）を
    # 導入する。導入済みならスキップする（冪等）。インストール済み一覧は
    # 「ベース名 + ホスト三つ組」（例: llvm-tools-x86_64-unknown-linux-gnu）で列挙され、
    # preview コンポーネントは `-preview` なしの名前で列挙されるため、正規化した
    # 候補名（そのまま / ホスト付き / -preview を剥いだ形とそのホスト付き）との
    # 厳密一致で判定する（前方一致だと rust-docs が rust-docs-json-<host> に
    # 誤一致する等の問題があるため）。ホスト三つ組の取得に失敗した場合は
    # スキップ判定を諦めて rustup component add へ倒す（add は導入済みなら冪等）。
    - name: Ensure additional components
      env:
        COMPONENTS: ${{ inputs.components }}
      shell: bash
      run: |
        set -euo pipefail
        [ -z "${COMPONENTS}" ] && exit 0
        IFS=',' read -r -a components <<< "${COMPONENTS}"
        installed="$(rustup component list --installed)"
        host="$(rustc -vV 2>/dev/null | sed -n 's/^host: //p' || true)"
        for raw in ${components[@]+"${components[@]}"}; do
          component="$(printf '%s' "${raw}" | xargs)"
          [ -z "${component}" ] && continue
          if ! printf '%s\n' "${component}" | grep -Eq '^[A-Za-z0-9._-]+$'; then
            echo "::error::components input に許可されない文字を含む値が指定されました（英数字・ドット・アンダースコア・ハイフンのみ許可）"
            exit 1
          fi
          candidates=("${component}")
          if [ -n "${host}" ]; then
            candidates+=("${component}-${host}")
          fi
          if [[ "${component}" == *-preview ]]; then
            base="${component%-preview}"
            candidates+=("${base}")
            if [ -n "${host}" ]; then
              candidates+=("${base}-${host}")
            fi
          fi
          found=false
          for candidate in "${candidates[@]}"; do
            if printf '%s\n' "${installed}" | grep -qxF -- "${candidate}"; then
              found=true
              break
            fi
          done
          if [ "${found}" = false ]; then
            rustup component add "${component}"
          fi
        done
