name: Rust Toolchain Setup
description: >-
  runner の rustup を検証し、リポジトリの rust-toolchain.toml にツールチェーンを同期する。
  rustup 未導入・破損時は既定で fail-closed（allow-network-install で導入を opt-in できる）

inputs:
  components:
    description: >-
      追加でインストールする rustup コンポーネント（カンマ区切り。例: llvm-tools-preview）。
      rust-toolchain.toml の components に既に列挙済みのものは指定不要
    required: false
    default: ''
  allow-network-install:
    description: >-
      rustup が未導入・破損している場合に、ネットワークから rustup-init を取得して
      導入することを許可する（'true' で有効）。既定は 'false' = fail-closed。

      既定を fail-closed にしている理由: 導入は `curl https://sh.rustup.rs | sh` で行われ、
      action 自体を commit SHA で pin しても取得されるスクリプトの内容は固定・検証されない。
      永続 self-hosted runner の root ジョブ（Docker socket を持つ構成もある）で
      未 pin のリモートコードが実行される供給網経路（OWASP A08 相当）になるため、
      既定では踏まず、runner 側の不備として明示的に失敗させる。

      恒久対応は runner イメージへ rustup を焼き込むこと。使い捨ての GitHub ホストランナーや、
      供給網リスクを許容できる環境でのみ 'true' にする。
    required: false
    default: 'false'
  sanitize-github-extraheader:
    description: >-
      グローバル git config のうち **github.com 向けにスコープされた**
      `http.<url>.extraheader` を、公開 repo（例: RustSec/advisory-db）への
      匿名 fetch へ、永続 self-hosted runner のホスト側に残置した失効済み資格情報
      （stale credential）が混入して 401 になるのを防ぐために取り除く
      （'true' で有効。既定 'true' = fail-closed でガードを効かせる）。

      **runner ホストの実 global config ファイルは一切書き換えない。** 該当キーを
      除いた内容をジョブ専用の隔離コピー（`${RUNNER_TEMP}` 配下、パーミッション 600）
      へ複製し、`GIT_CONFIG_GLOBAL` を `$GITHUB_ENV` 経由で当該コピーに向けることで、
      本ジョブの以降のステップにのみ適用する。他ホスト（private registry・別 Git
      サーバー等）向けの正当な認証ヘッダーはコピーにそのまま引き継がれ、実ファイル
      からも消えないため、並行実行中の他ジョブや本ジョブ以外の用途を壊さない。
      `actions/checkout` が正当に書き込むリポジトリローカルの認証設定にも触れない。
      credential helper もコピーからは除去しない（`gh auth setup-git` 等の正当な
      用途があるため）。credential helper 由来の 401 が残る場合は、呼び出し側の
      該当コマンドに `GIT_CONFIG_GLOBAL=/dev/null` を環境変数として渡す回避策を
      検討すること。

      グローバルに host 非限定（全ホスト対象）の `http.extraheader` が設定されている
      場合、対象ホストを安全に絞り込めない（他ホストの認証を壊さずに github.com 分
      だけ除去できない）ため隔離コピーからも取り除かない。ただしこの設定は
      github.com へも適用されうるため、隔離コピーに対する検証で github.com 向けに
      実効値が残っていると判明した場合はジョブを **fail-closed で失敗させる**
      （黙って残置させて 401 を再発させない、かつ黙って他ホストの認証を壊さない
      ための設計）。host 非限定の設定が github.com とは無関係な用途（例: private
      registry のみ）であれば、本ガードはジョブを失敗させない。この場合は runner
      ホスト側で host 非限定の設定を見直すこと。

      隔離コピー作成後は `GIT_CONFIG_GLOBAL=<コピー> git config --get-urlmatch
      http.extraheader https://github.com/` で github.com 向け実効値が残っていない
      ことを検証し、残っていればジョブを失敗させる。

      根本原因（ホスト側の残置資格情報）の恒久対応は runner ホスト側で行う
      （本 input は CI 側の多層防御の 1 層であり、根本対応の代替ではない）。
      互換問題が起きた場合の escape hatch として 'false' で無効化できる
      （ただし無効化すると本 input が防ぐ 401 を再発させうる）。
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    # self-hosted runner のホスト側グローバル git 設定（例: /root/.gitconfig）に
    # 失効済みトークンの extraheader が残置されていると、後続の全 git fetch
    # （cargo audit / cargo deny 等が行う公開 repo advisory-db の匿名 fetch を含む）
    # に混入し、本来認証不要な公開 repo への fetch が 401 で失敗する
    # （2026-08-19 観測。runner 再割当で pass する flaky な症状として現れた）。
    # 恒久対応（ホスト側残置資格情報の除去）は runner ホスト側の別イシューのスコープ。
    #
    # 本ステップは runner ホストの実 global config ファイルを直接書き換えない。
    # 該当キーを除いたジョブ専用の隔離コピーを作成し、GIT_CONFIG_GLOBAL で
    # 以降のステップにのみ適用する。実ファイルへの `--unset-all` は、それが
    # stale かどうかを判定できないまま正当な資格情報（並行実行中の他ジョブや
    # private dependency 取得が使うもの）まで永続的に破壊しうるため行わない。
    # リポジトリローカル config（actions/checkout が書き込む正当な認証設定）
    # には触れない。
    - name: Sanitize stale GitHub credentials in global git config
      env:
        SANITIZE: ${{ inputs.sanitize-github-extraheader }}
      shell: bash
      run: |
        set -euo pipefail

        # 'true'/'false' のみを明示的に受理する。typo・空白・大文字表記等の
        # 不正な値を「無効化」として黙って通すと fail-closed 設計が崩れるため、
        # 想定外の値はエラー終了とする。値そのものは workflow command 行へ
        # 混ぜない（改行や `::` を含む値による log/command 注入を避けるため）。
        case "${SANITIZE}" in
          true)
            ;;
          false)
            exit 0
            ;;
          *)
            echo "::error::sanitize-github-extraheader には 'true' または 'false' のみ指定できます"
            exit 1
            ;;
        esac

        # 値（トークンを含みうる）は一切出力せず、キー名のみを扱う。
        # グローバル config 不在・extraheader 不在は正常系（冪等）として扱う。
        # サブセクション（URL スコープ）は任意: `http.https://github.com/.extraheader` の
        # ような URL スコープ付きだけでなく、`http.extraheader`（全ホストに無条件で
        # 適用される、URL スコープ付きより悪質な形）も検出対象にする必要があるため
        # `^http\.(.*\.)?extraheader$` とする（`^http\..*\.extraheader$` だとサブセクションを
        # 必須にしてしまい、この無条件形を検出できない）。
        #
        # `--get-regexp` は「マッチ無し」を exit 1 で表す一方、config 破損等の
        # 実エラーも非 0 で返す。`|| true` で握り潰すと config 破損時に
        # 「stale credential 無し」と誤認して fail-open になるため、exit code を
        # 明示的に判定する（1 = マッチ無し = 正常系、それ以外 = エラー）。
        #
        # ここでの `git config --global` は、呼び出し側ジョブが既に GIT_CONFIG_GLOBAL
        # を設定済みであればそれを尊重する（git 自体の解決規則に委ねる）。
        set +e
        keys="$(git config --global --name-only --get-regexp '^http\.(.*\.)?extraheader$' 2>/dev/null)"
        get_rc=$?
        set -e

        if [ "${get_rc}" -ne 0 ] && [ "${get_rc}" -ne 1 ]; then
          echo "::error::グローバル git config の読み取りに失敗しました。config が破損している可能性があります"
          exit 1
        fi

        if [ -z "${keys}" ]; then
          exit 0
        fi

        # 隔離対象は github.com にスコープされたキーのみへ限定する（他ホスト向けの
        # 正当な認証ヘッダーを壊さないため）。host 非限定の `http.extraheader` は
        # 対象ホストを安全に絞り込めないため隔離コピーからも取り除かず、
        # fail-closed で失敗させる（黙って残置＝401 再発、黙って全除去＝他ホスト
        # 認証破壊、のどちらも避ける）。
        github_keys=""
        unconditional_present=false
        while IFS= read -r key; do
          [ -z "${key}" ] && continue
          if [ "${key}" = "http.extraheader" ]; then
            unconditional_present=true
            continue
          fi
          lower_key="$(printf '%s' "${key}" | tr '[:upper:]' '[:lower:]')"
          case "${lower_key}" in
            http.https://github.com.extraheader|http.https://github.com/*.extraheader|http.https://github.com:*.extraheader|http.http://github.com.extraheader|http.http://github.com/*.extraheader|http.http://github.com:*.extraheader)
              github_keys="${github_keys}${key}"$'\n'
              ;;
          esac
        done <<< "${keys}"

        # host 非限定キーの存在自体では失敗させない（github.com と無関係な
        # private registry 等のためだけに設定されているケースまで壊すため）。
        # 実際に github.com へ影響するかどうかは、隔離コピーに対する urlmatch
        # 検証で判定する。

        if [ -z "${github_keys}" ] && [ "${unconditional_present}" = false ]; then
          exit 0
        fi

        # ここから: 実 global config は書き換えず、除去済みの内容を
        # ジョブ専用の隔離コピーへ複製する（$RUNNER_TEMP 配下、他ジョブ・
        # 他ユーザーから読めないようパーミッションを絞る）。`git config --list -z`
        # で得られる値はマージ済みの実効値そのものであり、include/includeIf を
        # 経由する断片も展開済みとして複製されるため、コピー先で include の
        # 相対パス解決が壊れる心配がない。
        tmp_dir="$(mktemp -d "${RUNNER_TEMP:-/tmp}/git-global-sanitized.XXXXXX")"
        chmod 700 "${tmp_dir}"
        copy="${tmp_dir}/gitconfig"
        : > "${copy}"
        chmod 600 "${copy}"

        set +e
        git config --global --list -z >"${tmp_dir}/list.raw" 2>/dev/null
        list_rc=$?
        set -e

        if [ "${list_rc}" -ne 0 ] && [ "${list_rc}" -ne 1 ]; then
          echo "::error::グローバル git config の隔離コピー作成に失敗しました（一覧取得エラー）"
          exit 1
        fi

        while IFS= read -r -d '' entry; do
          [ -z "${entry}" ] && continue
          entry_key="${entry%%$'\n'*}"
          entry_value="${entry#*$'\n'}"
          skip=false
          if [ -n "${github_keys}" ]; then
            while IFS= read -r gk; do
              [ -z "${gk}" ] && continue
              if [ "${entry_key}" = "${gk}" ]; then
                skip=true
                break
              fi
            done <<< "${github_keys}"
          fi
          if [ "${skip}" = true ]; then
            continue
          fi
          if ! git config --file "${copy}" --add -- "${entry_key}" "${entry_value}"; then
            echo "::error::グローバル git config の隔離コピー作成に失敗しました（キーの複製に失敗）"
            exit 1
          fi
        done < "${tmp_dir}/list.raw"

        if [ -n "${github_keys}" ]; then
          count="$(printf '%s\n' "${github_keys}" | grep -c .)"
          # count は算出した件数であり、任意入力ではないため直接出力してよい。
          echo "::notice::stale な可能性がある GitHub 資格情報をジョブ専用の隔離済み global git config へ切り離しました（該当キー数: ${count} 件。runner ホストの実ファイルは変更していません）"
        fi

        # 隔離コピーに対する検証（fail-closed）: github.com への実効 extraheader が
        # 本当に残っていないことを urlmatch で確認する。これは github.com スコープの
        # キーの複製漏れだけでなく、host 非限定の `http.extraheader`（取り除かずに
        # コピーへ残した分）が実際に github.com へ適用されてしまうケースも検出する。
        # 残っていればガード失敗とする（黙って 401 を再発させない）。
        # --get-urlmatch の exit code: 0 = 実効値あり, 1 = マッチ無し（正常系）,
        # それ以外 = config 破損等の実エラー。`|| true` で握り潰すと読み取り異常時に
        # 「実効値なし」と誤判定して fail-open になるため、exit code を明示的に判定する。
        set +e
        remaining="$(GIT_CONFIG_GLOBAL="${copy}" git config --get-urlmatch http.extraheader https://github.com/ 2>/dev/null)"
        urlmatch_rc=$?
        set -e

        if [ "${urlmatch_rc}" -ne 0 ] && [ "${urlmatch_rc}" -ne 1 ]; then
          echo "::error::除去後の検証で、隔離コピーの読み取りに失敗しました。config が破損している可能性があるためガードを失敗させます"
          exit 1
        fi

        if [ "${urlmatch_rc}" -eq 0 ] && [ -n "${remaining}" ]; then
          if [ "${unconditional_present}" = "true" ]; then
            echo "::error::グローバル git config に host 非限定の http.extraheader（全ホスト対象）が存在し、github.com にも適用されています。他ホストの認証を壊さずに github.com 分のみを安全に除去できないため、ガードを失敗させます。runner ホスト側でこの設定を見直してください"
          else
            echo "::error::隔離コピーでも github.com 向け extraheader が実効値として残存しています。ガードに失敗しました"
          fi
          exit 1
        fi

        # 以降のステップにのみ隔離コピーを適用する（runner ホストの実 global
        # config はこの時点でも一切変更していない）。
        echo "GIT_CONFIG_GLOBAL=${copy}" >> "${GITHUB_ENV}"

    # 後続の「Sync toolchain」の前提（rustup show の実行可否）を満たしているか検証する。
    # 健全な導入済み環境では何もしない（冪等・追加コストほぼゼロ）。
    #
    # rustup が未導入・破損している場合の既定は **fail-closed**。ネットワークからの
    # 導入は allow-network-install: 'true' の明示的な opt-in が要る（input の説明を参照）。
    # 「runner に rustup が無い」は runner イメージ側の不備なので、ここで曖昧に
    # 取り繕わず、何が足りないかを明示して落とすほうが診断的にも安全上も良い
    # （黙って PATH だけ通して後続が exit 127 で落ちる、が従来の失敗モードだった）。
    #
    # 導入する場合、$GITHUB_PATH へ追記するのは `$HOME/.cargo/bin` 決め打ちではなく
    # `${CARGO_HOME:-$HOME/.cargo}/bin` であること。rustup-init は
    # **CARGO_HOME を尊重して**そこへ cargo/rustup 本体を配置するため、
    # CARGO_HOME を設定済みの runner（例: コンテナイメージ側で
    # `ENV CARGO_HOME=/opt/cargo` を持つ self-hosted runner）で決め打ちすると、
    # インストールは成功しているのに PATH に載るのが実在しない
    # `$HOME/.cargo/bin` になり、後続ステップが `cargo: command not found`
    # （exit 127）で落ちる。本ステップが緑のまま失敗するため原因究明も難しい。
    - name: Ensure rustup is available
      env:
        ALLOW_NETWORK_INSTALL: ${{ inputs.allow-network-install }}
      shell: bash
      run: |
        set -euo pipefail

        if command -v rustup >/dev/null 2>&1 && rustup --version >/dev/null 2>&1; then
          exit 0
        fi

        if [ "${ALLOW_NETWORK_INSTALL}" != "true" ]; then
          echo "::error::この runner に rustup がありません（未導入、または破損して実行できません）。"
          echo '::error::本アクションは既定で fail-closed です。ネットワークからの rustup 導入は'
          echo '::error::curl https://sh.rustup.rs | sh を伴い、pin できないリモートコードを'
          echo '::error::ジョブ権限で実行することになるため、既定では行いません。'
          echo "::error::恒久対応: runner イメージへ rustup を焼き込んでください。"
          echo "::error::どうしても runner 上で導入する場合は allow-network-install: 'true' を明示してください。"
          echo "診断情報:"
          echo "  RUSTUP_HOME=${RUSTUP_HOME:-<未設定>}"
          echo "  CARGO_HOME=${CARGO_HOME:-<未設定>}"
          echo "  PATH=${PATH}"
          exit 1
        fi

        echo "::warning::allow-network-install: 'true' のため、ネットワークから rustup を導入します（供給網リスクを許容した設定です）"
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none
        echo "${CARGO_HOME:-${HOME}/.cargo}/bin" >> "${GITHUB_PATH}"

    # rustup show はカレントディレクトリの rust-toolchain.toml を検出し、
    # 指定チャネル・components を未導入なら自動インストールする
    # （rust-toolchain.toml を単一真実源とするため、toolchain 指定 input は設けない）。
    - name: Sync toolchain (rust-toolchain.toml)
      shell: bash
      run: |
        set -euo pipefail
        rustup show

    # 呼び出し側ジョブ固有の追加コンポーネント（例: カバレッジ用 llvm-tools-preview）を
    # 導入する。導入済みならスキップする（冪等）。インストール済み一覧は
    # 「ベース名 + ホスト三つ組」（例: llvm-tools-x86_64-unknown-linux-gnu）で列挙され、
    # preview コンポーネントは `-preview` なしの名前で列挙されるため、正規化した
    # 候補名（そのまま / ホスト付き / -preview を剥いだ形とそのホスト付き）との
    # 厳密一致で判定する（前方一致だと rust-docs が rust-docs-json-<host> に
    # 誤一致する等の問題があるため）。ホスト三つ組の取得に失敗した場合は
    # スキップ判定を諦めて rustup component add へ倒す（add は導入済みなら冪等）。
    - name: Ensure additional components
      env:
        COMPONENTS: ${{ inputs.components }}
      shell: bash
      run: |
        set -euo pipefail
        [ -z "${COMPONENTS}" ] && exit 0
        IFS=',' read -r -a components <<< "${COMPONENTS}"
        installed="$(rustup component list --installed)"
        host="$(rustc -vV 2>/dev/null | sed -n 's/^host: //p' || true)"
        for raw in ${components[@]+"${components[@]}"}; do
          component="$(printf '%s' "${raw}" | xargs)"
          [ -z "${component}" ] && continue
          if ! printf '%s\n' "${component}" | grep -Eq '^[A-Za-z0-9._-]+$'; then
            echo "::error::components input に許可されない文字を含む値が指定されました（英数字・ドット・アンダースコア・ハイフンのみ許可）"
            exit 1
          fi
          candidates=("${component}")
          if [ -n "${host}" ]; then
            candidates+=("${component}-${host}")
          fi
          if [[ "${component}" == *-preview ]]; then
            base="${component%-preview}"
            candidates+=("${base}")
            if [ -n "${host}" ]; then
              candidates+=("${base}-${host}")
            fi
          fi
          found=false
          for candidate in "${candidates[@]}"; do
            if printf '%s\n' "${installed}" | grep -qxF -- "${candidate}"; then
              found=true
              break
            fi
          done
          if [ "${found}" = false ]; then
            rustup component add "${component}"
          fi
        done
