name: Idempotent Issue
description: ラベルを冪等に作成し、同一検索条件の open Issue が存在しない場合のみ Issue を起票する

inputs:
  label:
    description: '起票 Issue に付与するラベル名（重複検索の絞り込みにも使用）'
    required: true
  label-color:
    description: 'ラベルの色（6 桁 16 進、例: B60205）。省略時は gh の既定値'
    required: false
    default: ''
  label-description:
    description: 'ラベルの説明。省略時は設定しない'
    required: false
    default: ''
  search-query:
    description: '重複確認に使う検索クエリ（`gh issue list --search` へデータとして渡す）'
    required: true
  title:
    description: '起票する Issue のタイトル'
    required: true
  body-file:
    description: 'Issue 本文の Markdown ファイルパス'
    required: true
  token:
    description: 'ラベル作成・Issue 検索・起票に使用するトークン（issues: write 権限）'
    required: false
    default: ${{ github.token }}

outputs:
  created:
    description: '新規起票したら true、既存 open Issue があり起票をスキップしたら false'
    value: ${{ steps.issue.outputs.created }}
  issue-number:
    description: '新規起票した Issue、または検知した既存 open Issue の番号'
    value: ${{ steps.issue.outputs.issue-number }}
  issue-url:
    description: '新規起票した Issue、または検知した既存 open Issue の URL'
    value: ${{ steps.issue.outputs.issue-url }}

runs:
  using: composite
  steps:
    - name: Create issue idempotently
      id: issue
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        LABEL: ${{ inputs.label }}
        LABEL_COLOR: ${{ inputs.label-color }}
        LABEL_DESCRIPTION: ${{ inputs.label-description }}
        SEARCH_QUERY: ${{ inputs.search-query }}
        ISSUE_TITLE: ${{ inputs.title }}
        BODY_FILE: ${{ inputs.body-file }}
      run: |
        set -euo pipefail

        # ラベルは冪等に用意する。既存ラベルへ無条件に `--force` を使うと、
        # color 未指定時に gh がランダム色を選び直し実行のたびにラベル色が変異する
        # （非冪等）ため、存在確認で分岐する:
        # - 既存: color / description が明示されている場合のみ、その項目だけを
        #   `gh label edit` で更新する（未指定なら何もしない）
        # - 未存在: `gh label create` で新規作成する（並行実行との race で失敗しても
        #   警告のみで続行）
        # gh の一時障害でラベル処理（存在確認・作成・更新）に失敗しても、重複判定・
        # 起票の本処理は続行する（警告のみ。移植元の ci.yml dep-audit /
        # bench-schedule.yml の「ラベル作成失敗は警告のみ」方針と整合）。
        # ただし存在確認自体の失敗時は、コールドスタート（ラベル未存在）だと後続の
        # `gh issue create --label` が存在しないラベルを理由に失敗してしまうため、
        # スキップではなく `--force` なしの `gh label create` を試みるフォールバック
        # とする（既存なら already exists で失敗するが警告のみで続行 → 既存ラベルの
        # 色を変異させない性質は維持。未存在なら作成され起票が通る）。
        create_args=()
        if [ -n "${LABEL_COLOR}" ]; then
          create_args+=(--color "${LABEL_COLOR}")
        fi
        if [ -n "${LABEL_DESCRIPTION}" ]; then
          create_args+=(--description "${LABEL_DESCRIPTION}")
        fi
        if label_names="$(gh label list --limit 1000 --json name --jq '.[].name')"; then
          if printf '%s\n' "${label_names}" | grep -qxF "${LABEL}"; then
            # 既存ラベル: color / description が明示されている場合のみ該当項目を更新する
            # （--color / --description は create と同じフラグ体系のため配列を共用）。
            if [ "${#create_args[@]}" -gt 0 ]; then
              gh label edit "${LABEL}" "${create_args[@]}" \
                || echo "警告: ラベル ${LABEL} の更新に失敗しました（本処理は続行します）" >&2
            fi
          else
            gh label create "${LABEL}" ${create_args[@]+"${create_args[@]}"} \
              || echo "警告: ラベル ${LABEL} の作成に失敗しました（本処理は続行します）" >&2
          fi
        else
          # 存在確認の失敗時フォールバック: `--force` なしの create を試みる。
          # 既存ラベルなら already exists で失敗するが警告のみで続行し（色は不変）、
          # 未存在（コールドスタート）なら作成されて後続の起票が通る。
          echo "警告: ラベル一覧の取得に失敗しました。ラベル作成を試行します（既存なら失敗しても続行します）" >&2
          gh label create "${LABEL}" ${create_args[@]+"${create_args[@]}"} \
            || echo "警告: ラベル ${LABEL} の作成に失敗しました（本処理は続行します）" >&2
        fi

        # 重複起票防止: 同一検索条件 + 同一ラベルの open Issue が既にあれば起票しない。
        # 検索クエリはデータとして渡し、シェル再解釈やコマンド置換に埋め込まない
        # （コマンドインジェクション対策）。検索自体が失敗した場合は、重複起票の
        # リスクを避けるためフェイルクローズで異常終了する。
        # JSON の加工は外部 jq バイナリではなく gh 内蔵の --jq で行い（bash + gh CLI
        # のみの規約）、検索結果の揺れを避けるため gh 呼び出しは 1 回に留めて
        # 先頭 Issue の「番号 TAB URL」（0 件なら空文字）を導出する。
        existing="$(gh issue list \
          --search "${SEARCH_QUERY}" \
          --state open \
          --label "${LABEL}" \
          --json number,url \
          --jq '.[0] // empty | [.number, .url] | @tsv')"

        if [ -n "${existing}" ]; then
          existing_number="${existing%%$'\t'*}"
          existing_url="${existing#*$'\t'}"
          echo "既存 open Issue があるため起票をスキップします: #${existing_number} (${existing_url})"
          {
            echo "created=false"
            echo "issue-number=${existing_number}"
            echo "issue-url=${existing_url}"
          } >> "${GITHUB_OUTPUT}"
          exit 0
        fi

        if [ ! -f "${BODY_FILE}" ]; then
          echo "エラー: body-file が見つかりません: ${BODY_FILE}" >&2
          exit 1
        fi

        # gh issue create は成功時に Issue URL を標準出力へ返す。
        issue_url="$(gh issue create \
          --title "${ISSUE_TITLE}" \
          --label "${LABEL}" \
          --body-file "${BODY_FILE}")"
        issue_number="${issue_url##*/}"
        echo "Issue を起票しました: #${issue_number} (${issue_url})"
        {
          echo "created=true"
          echo "issue-number=${issue_number}"
          echo "issue-url=${issue_url}"
        } >> "${GITHUB_OUTPUT}"
