# private リポジトリ向け wrapper テンプレート。
# 呼び出し側リポジトリの .github/workflows/codex-review.yml へコピーして使う。
# 導入手順は Fandhe-AI/actions の codex-review/README.md「セットアップ」を参照。
name: Codex PR review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

# reusable workflow のトップレベル concurrency は機能しないため呼び出し側で設定する
concurrency:
  group: codex-review-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  codex-review:
    uses: Fandhe-AI/actions/.github/workflows/codex-review.yml@latest
    permissions:
      contents: read
      pull-requests: write
    # private リポジトリでは runner 既定値（codex ジョブ: codex / コメント投稿ジョブ:
    # self-hosted）が組織 runner 方針に合致するため、runner ラベルの指定は不要。
    # 詳細は docs/runner-policy.md を参照。
    #
    # P2/P3 もブロック対象へ追加したい場合は block-priorities を渡す
    # （既定は "P0,P1"。P0/P1 は除外不可で、P2/P3 の追加のみ調整できる）:
    # with:
    #   block-priorities: "P0,P1,P2"
    #
    # 自動生成 PR（update-external.yml による日次同期 PR など）をレビュー対象から
    # 外す場合は skip する head branch 名の接頭辞をカンマ区切りで渡す（既定は空 =
    # 全 PR をレビュー。同期 PR は上流の取り込みそのもので、指摘の修正先が上流
    # リポジトリにしかないため）。判定はブランチ名の接頭辞のみで行うため、push
    # できる主体は該当接頭辞のブランチで gate を回避できる（受容済み残留リスク。
    # 第三者の write コラボレーターがいる場合は指定しないこと）。codex ジョブは
    # job 単位で skip され、check-run は skipped 結論で生成されるので required
    # status check は満たされる:
    # with:
    #   skip-branch-prefixes: chore/skills-update,chore/submodule-update
