# private リポジトリ向け wrapper テンプレート。
# 呼び出し側リポジトリの .github/workflows/codex-review.yml へコピーし、<SHA> を差し替える。
# 導入手順は Fandhe-AI/actions の codex-review/README.md「セットアップ」を参照。
name: Codex PR review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

# reusable workflow のトップレベル concurrency は機能しないため呼び出し側で設定する
concurrency:
  group: codex-review-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  codex-review:
    # <SHA> は Fandhe-AI/actions のコミット SHA で固定する（@main 不可）
    uses: Fandhe-AI/actions/.github/workflows/codex-review.yml@<SHA> # main
    permissions:
      contents: read
      pull-requests: write
    # private リポジトリでは runner 既定値（codex ジョブ: codex / コメント投稿ジョブ:
    # self-hosted）が組織 runner 方針に合致するため、runner ラベルの指定は不要。
    # 詳細は docs/runner-policy.md を参照。
    #
    # P2/P3 もブロック対象へ追加したい場合は block-priorities を渡す
    # （既定は "P0,P1"。P0/P1 は除外不可で、P2/P3 の追加のみ調整できる）:
    # with:
    #   block-priorities: "P0,P1,P2"
    #
    # update-external.yml による日次同期 PR をレビュー対象から外す場合は
    # skip-sync-pr-review を渡す（既定 false。同期 PR は上流の取り込みそのもので、
    # 指摘の修正先が上流リポジトリにしかないため）。判定は sync-gate ジョブが
    # 変更ファイル集合を実測して行い、ブランチ名だけでは skip しない。codex ジョブは
    # job 単位で skip され、check-run は skipped 結論で生成されるので required
    # status check は満たされる:
    # with:
    #   skip-sync-pr-review: true
