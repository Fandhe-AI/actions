name: Rust base CI (reusable)

# Rust リポジトリのベースライン品質ゲート（fmt / clippy / test / cargo-deny）を共通化する
# reusable workflow。Fandhe-AI/local-llm-server・Fandhe-AI/rust-ai-library の ci.yml が
# ほぼ同型で重複していたものを workflow_call 化して集約したもの（イシュー #28）。
#
#   jobs:
#     rust-ci:
#       permissions:
#         contents: read
#       uses: Fandhe-AI/actions/.github/workflows/rust-base-ci.yml@latest
#       with:
#         runner-label: self-hosted
#
# 設計の要点:
# - runner は runner-label 入力で呼び出し元から指定する（組織方針: public リポジトリは
#   ubuntu ホステッド / private リポジトリは self-hosted。イシュー #33）
# - Cargo.toml 検出ガード: Checkout 直後の detect ステップで Cargo.toml の有無を判定し、
#   以降のステップを `if: steps.detect.outputs.has_cargo == 'true'` でスキップする
#   （ジョブ自体は success のまま終了し CI を落とさない自己修復方式）。ジョブ単位の `if:`
#   ではなく各ステップの `if:` で判定しているのは、`jobs.<id>.if` が Checkout 前
#   （ワークスペース展開前）に評価されるため hashFiles('Cargo.toml') が常に空文字となり
#   判定できないため
# - ジョブ単位の enable/disable 入力は設けない。ジョブを skip させると集約ジョブ
#   （rust-base-ci-complete）の fail-closed 判定（result != success で失敗）に引っかかり、
#   skip を例外扱いする追加機構が必要になるため。ジョブ構成の増減は呼び出し側の
#   独自ジョブで行う
# - コマンドの自由記述入力（fmt-args / clippy-args 等）は設けない。移行元 2 リポジトリで
#   差分がなく、`run:` 内での非クォート展開（単語分割）というシェル注入面だけが増えるため。
#   唯一差分のある deny-checks は閉じた whitelist との厳密一致で fail-closed 検証する
# - rustup セットアップは rust-toolchain-setup action に委譲する（バージョン固定・冪等・
#   runner のグローバル状態を汚さない方針を 1 箇所へ集約）。cargo-deny の導入だけは
#   cargo-tool-install action に委譲せずインライン実装している: cargo-deny の MSRV
#   （0.20.x は 1.88.0）が呼び出し側 rust-toolchain.toml のチャネルより新しい場合に
#   `cargo install` が失敗するため、ビルド専用に stable を別途導入して
#   RUSTUP_TOOLCHAIN=stable でビルドする必要があるため（deny ジョブのコメント参照）
# - concurrency は reusable workflow のトップレベルでは機能しないため呼び出し側で設定する
#   （README のセットアップ例参照）
# - cache 有効時（clippy / test ジョブのみ）は `CARGO_INCREMENTAL=0` を設定し incremental
#   成果物を生成させない（保存後に除外するのではなく生成自体を抑止する）。使い捨て runner
#   では復元後の差分ビルドで incremental の恩恵が小さいため導入したが、v2（incremental
#   抑止のみ）の実 CI 計測では blob 縮小への寄与は確認できなかった（#131 の生 du 値ベースの
#   推定では約 9.6% だったが実測とは一致せず）。blob の縮小は下記の保存前 prune（v3）に
#   依存する（計測: rust-base-ci/cache-before-after-2026-09-17.md、イシュー #134）。
# - cache を保存する run では cargo 実行ステップ直後・actions/cache の保存より前に workspace
#   メンバー成果物を prune する（保存しない run では prune も省く。判定は保存ステップと
#   共有する cache-save-decision ステップの出力）。メンバー crate の成果物はソース変更の
#   たびに必ず再ビルドされキャッシュ価値がないため（#131 計測で target/debug/deps が
#   全体の約 81.5%、うち大半は統合テスト・ベンチバイナリ。イシュー #133）。依存 crate の
#   成果物（deps/ の依存側 rlib・~/.cargo）は残す
#   あわせてキーへ版セグメント `v3` を追加した（#132 で導入した `v2` からの bump。現行は下記の
#   rustc の版を含む `v4`）。
#   既存キーへの exact hit では actions/cache が保存をスキップし縮小版が永久に保存されない
#   ため、新キー空間へ切り替える必要があった。当時の restore-keys は `v3` に加えて `v2` へも
#   フォールバックしていた: v2 blob は incremental を含まず（#132 で生成自体を抑止済み）、
#   prune は保存前に走るため、v2 を復元してビルド・prune した上で v3 として保存しても
#   縮小の意味は損なわれない（v2→v3 は cold run を挟まずに移行できる）。v2 の
#   restore-keys 行は v4 への切り替えで削除した。版を bump する場合は
#   clippy / test 両ジョブを同時に更新する
# - cache は actions/cache/restore と actions/cache/save に分けて使い、保存は `cache-save`
#   入力（既定 true）で止められる。呼び出し側が `cache-save: ${{ github.ref == 'refs/heads/main' }}`
#   を渡すと main の push だけが保存し、pull_request は main の cache を restore するだけになる。
#   PR の cache は refs/pull/<N>/merge スコープに保存され他の PR・main から読めないため、
#   Cargo.lock を変えた PR や main より先に走った PR が main と同内容の blob を PR ごとに
#   重複保存し、リポジトリの cache 容量（10 GB）を消費していた（fandhe-container 実測:
#   同一キーの blob が main・PR 3 件で 4 重に保存された）。保存ステップは cargo 実行・prune の
#   後ろに置き、既定の success() 条件（cargo 失敗時は保存しない）と exact hit 時の保存スキップを
#   actions/cache の post 保存と同じに保つ
# - cache key のハッシュはルートの Cargo.lock だけを入力にする（`**/Cargo.lock` だと
#   workspace 外のサンプル・治具の Cargo.lock の変更でもキーが変わり、同内容の blob が増える）
# - clippy / test の key には rustc の版（`rustc -vV` の release・commit-hash）も入れる（版セグメント `v4`。v3 へは移行期間
#   だけフォールバックする）。rust-toolchain.toml が stable 追従だと runner イメージの更新で rustc が
#   変わり、key に rustc が無いと旧 rustc の target に exact hit し続けて依存を毎回全再ビルドし、
#   exact hit のため保存もされない。toolchain の取得を cache の restore より前に移した
# - deny ジョブは cargo-deny のバイナリ（~/.cargo/bin/cargo-deny）を OS・アーキテクチャ・
#   runner イメージ・バージョンをキーに cache し、毎回のソースビルド（約 85 秒）を省く
# - `cache` 入力が効くのは clippy / test / deny ジョブだけで、fmt ジョブは cache を持たない。
#   `cargo fmt` は依存の取得もビルドもせず保存対象のパスを作らないため、restore は毎回 miss し、
#   保存は "Path Validation Error" の警告を出すだけだった（fandhe-db run 38121631475）
#
# 前提1: runner に正常動作する rustup が導入済みであること。rust-toolchain-setup v1.1.0（#86）
# 以降、rustup が未導入・破損している場合はネットワーク導入せず fail-closed でエラー終了する。
# GitHub ホステッドランナーは rustup 同梱。self-hosted は runner イメージ側で用意する。
# 前提2: 呼び出し側リポジトリに rust-toolchain.toml が存在すること。rust-toolchain-setup は
# rust-toolchain.toml を単一真実源として toolchain を同期するため、不在の runner では
# 既定ツールチェーンが決まらない（移行元 ci.yml の `--default-toolchain stable` からの
# 挙動差分。README の前提条件参照）。

on:
  workflow_call:
    inputs:
      runner-label:
        description: >-
          全ジョブを実行する runner ラベル（public リポジトリは ubuntu-latest 等、
          private リポジトリは self-hosted。組織方針はイシュー #33 参照）
        type: string
        required: false
        default: self-hosted
      deny-checks:
        description: >-
          `cargo deny check` に渡すチェック名（空白区切り）。
          advisories / bans / licenses / sources のみ許容し、それ以外は fail-closed で拒否する
        type: string
        required: false
        default: advisories licenses sources
      cargo-deny-version:
        description: cargo-deny の固定バージョン（インストール後に厳密一致で検証される）
        type: string
        required: false
        default: 0.20.2
      cache:
        description: >-
          cargo レジストリ・target ディレクトリの cache を有効にする（オプトイン。
          clippy / test / deny ジョブが対象で、fmt ジョブは cache を持たない）。
          workspace が永続する self-hosted runner では通常不要なため既定は false
        type: boolean
        required: false
        default: false
      cache-key-prefix:
        description: cache key の接頭辞（同一 runner を共有する複数リポジトリでの衝突回避用）
        type: string
        required: false
        default: rust-base-ci
      cache-save:
        description: >-
          `cache: true` のとき cache を保存するか（false で restore のみ）。
          main だけで保存する場合は呼び出し側で式 github.ref == 'refs/heads/main' の値を渡す
        type: boolean
        required: false
        default: true
      fmt-timeout-minutes:
        description: fmt ジョブの timeout（分）
        type: number
        required: false
        default: 10
      clippy-timeout-minutes:
        description: clippy ジョブの timeout（分）
        type: number
        required: false
        default: 30
      test-timeout-minutes:
        description: test ジョブの timeout（分）
        type: number
        required: false
        default: 30
      deny-timeout-minutes:
        description: deny ジョブの timeout（分）
        type: number
        required: false
        default: 20

# reusable workflow のジョブが必要とする最小権限。呼び出し側が付与した権限を絞る方向にしか
# 働かないため、呼び出し側の `uses:` ジョブ（またはワークフロー）にも contents: read が必要。
permissions:
  contents: read

jobs:
  # --------------------------------------------------
  # cargo fmt --check（整形差分の検出）
  # --------------------------------------------------
  fmt:
    name: cargo fmt --check
    runs-on: ${{ inputs.runner-label }}
    timeout-minutes: ${{ inputs.fmt-timeout-minutes }}
    steps:
      - name: Checkout
        # actions/checkout v6.0.3。persist-credentials: false: checkout 後どのステップも
        # GITHUB_TOKEN を使わないため、既定の .git/config への認証情報永続化を無効化し、
        # 共有 self-hosted runner の workspace にトークンを残留させない。
        # submodules は既定（false）のまま: fmt/clippy/test/deny に不要。
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Cargo.toml の有無を判定
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "Cargo.toml" ]; then
            echo "has_cargo=true" >> "${GITHUB_OUTPUT}"
          else
            echo "has_cargo=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Cargo.toml が無いため cargo fmt --check をスキップしました"
          fi

      # fmt ジョブは `cache: true` でも cache を restore・保存しない（冒頭の設計の要点参照）。

      # rust-toolchain.toml への同期と rustfmt component の冪等追加を担う。
      # v1.1.0 以降、rustup が未導入・破損している場合はネットワーク導入せず
      # fail-closed でエラー終了する（#86）。rustup 自体の供給は runner イメージ側の責務。
      # 相対参照（uses: ./rust-toolchain-setup）は「呼び出し側リポジトリのチェックアウト」を
      # 参照するため本 workflow では使えず、必ず <owner>/<repo>/<path>@<ref> 形式で指す。
      # ref は「コミット SHA 固定 + # <バージョン> コメント」形式で書く（`# main` のような
      # 可動参照ラベルは使わない）。参照先 action を更新した際は各 SHA を手動で追随させる
      # （README の「SHA の更新方法」参照）。
      - name: Setup Rust toolchain (rustfmt)
        if: steps.detect.outputs.has_cargo == 'true'
        uses: Fandhe-AI/actions/rust-toolchain-setup@latest
        with:
          components: rustfmt

      - name: cargo fmt --check
        if: steps.detect.outputs.has_cargo == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all --check

  # --------------------------------------------------
  # cargo clippy -- -D warnings（lint ゲート）
  # --all-features を指定し、feature が増えた際にも既定で全 feature を lint 対象にする。
  # --------------------------------------------------
  clippy:
    name: cargo clippy
    runs-on: ${{ inputs.runner-label }}
    timeout-minutes: ${{ inputs.clippy-timeout-minutes }}
    steps:
      - name: Checkout
        # persist-credentials: false（fmt ジョブと同一方針）。
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Cargo.toml の有無を判定
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "Cargo.toml" ]; then
            echo "has_cargo=true" >> "${GITHUB_OUTPUT}"
          else
            echo "has_cargo=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Cargo.toml が無いため cargo clippy をスキップしました"
          fi

      - name: インクリメンタルコンパイルを無効化（cache 有効時のみ）
        # cache: true のときだけ CARGO_INCREMENTAL=0 を設定する（Restore cargo cache と
        # 同一条件）。incremental ディレクトリの削除ではなく生成自体の抑止であり、以降の
        # ステップ（toolchain setup・cargo clippy）に効く。使い捨て runner では復元後の
        # 差分ビルドの恩恵が小さい一方、キャッシュ blob を肥大化させていたため（#132）。
        if: inputs.cache && steps.detect.outputs.has_cargo == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "CARGO_INCREMENTAL=0" >> "${GITHUB_ENV}"

      - name: Setup Rust toolchain (clippy)
        if: steps.detect.outputs.has_cargo == 'true'
        uses: Fandhe-AI/actions/rust-toolchain-setup@latest
        with:
          components: clippy

      # target の成果物は rustc の版ごとに別物になるため、key に rustc の版（`rustc -vV` の release・commit-hash）を入れる。
      # 入れないと runner イメージの更新で stable の rustc が変わった後も旧 rustc の blob に
      # exact hit し続け、依存を毎回全再ビルドしたうえ exact hit のため保存もされない。
      # toolchain は rust-toolchain.toml に従うため、Setup Rust toolchain の後に取得する
      - name: rustc の版を取得（cache key 用）
        id: rustc
        if: inputs.cache && steps.detect.outputs.has_cargo == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # ハッシュ計算コマンド（sha256sum）は macOS 等に無いことがあるため使わず、
          # release と commit-hash の行から key 用の文字列を作る（例: 1.99.0-b940084d7c4b）
          info="$(rustc -vV)"
          printf '%s\n' "${info}"
          release="$(printf '%s\n' "${info}" | awk '/^release:/{print $2}')"
          commit="$(printf '%s\n' "${info}" | awk '/^commit-hash:/{print substr($2,1,12)}')"
          hash="${release:-unknown}-${commit:-unknown}"
          if ! printf '%s' "${hash}" | grep -qE '^[A-Za-z0-9._-]+$'; then
            hash=unknown
          fi
          echo "hash=${hash}" >> "${GITHUB_OUTPUT}"

      - name: Restore cargo cache
        # キーの `v4` は rustc の版（上のステップ）を key に入れた空間への切り替えセグメント。
        # restore-keys は同じ rustc の `v4` を優先し、移行期間だけ `v3`（rustc を含まない旧 key。
        # 保存前 prune 済み・#133）にもフォールバックする（cold run を挟まない移行）。`v3` 行は
        # `v3` blob が evict（7 日）された後に削除してよい。`v3` の blob が別の rustc のものだった
        # 場合は依存が再ビルドされるが、新しい `v4` の key で保存し直されるため 1 回で収まる。
        # 版を bump する場合は clippy / test 両ジョブを同時に更新する
        id: cargo-cache
        if: inputs.cache && steps.detect.outputs.has_cargo == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ inputs.cache-key-prefix }}-${{ runner.os }}-clippy-v4-${{ steps.rustc.outputs.hash }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ inputs.cache-key-prefix }}-${{ runner.os }}-clippy-v4-${{ steps.rustc.outputs.hash }}-
            ${{ inputs.cache-key-prefix }}-${{ runner.os }}-clippy-v3-

      - name: cargo clippy --workspace --all-targets --all-features
        if: steps.detect.outputs.has_cargo == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --workspace --all-targets --all-features -- -D warnings

      # 保存するかの判定。下の prune と Save cargo cache はこの出力だけを条件にし、判定を
      # 2 か所に書かない。`cache-save: false`（PR で restore のみ）と primary key への
      # exact hit では保存しないため save=false になる。cache 無効・Cargo.toml 不在・前段の
      # 失敗ではこのステップ自体が skip され、出力が空のため prune・保存も skip される
      - name: cache を保存するか判定
        id: cache-save-decision
        if: inputs.cache && steps.detect.outputs.has_cargo == 'true'
        shell: bash
        env:
          SAVE: ${{ inputs.cache-save && steps.cargo-cache.outputs.cache-hit != 'true' }}
        run: |
          set -euo pipefail
          if [ "${SAVE}" = "true" ]; then
            echo "save=true" >> "${GITHUB_OUTPUT}"
          else
            echo "save=false" >> "${GITHUB_OUTPUT}"
            echo "cache を保存しない run のため、保存前 prune と保存をスキップします"
          fi

      - name: workspace メンバー成果物を prune（cache を保存する run のみ）
        # 保存（下の Save cargo cache）はこの後に走るため、ここで削除した分は
        # 保存対象から外れる。メンバー crate の成果物はソース変更で必ず再ビルドされるため
        # キャッシュ価値がなく、blob を肥大化させる主因だった（#131 計測・#133）。
        # 依存 crate の成果物（deps/ の依存側 rlib・~/.cargo）は残す。
        # prune の目的は保存する blob の縮小だけで、後続に prune 後の target を使うステップは
        # 無い。そのため保存しない run（PR の restore のみ・exact hit）では実行しない
        # （保存の判定は上の cache-save-decision と共有する）。
        # if: always() は付けない（cargo 失敗時は判定ステップも既定の success() 条件で
        # skip され保存しないため、prune を実行する必要がない）。
        if: steps.cache-save-decision.outputs.save == 'true'
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v jq >/dev/null 2>&1; then
            echo "::error::jq が見つかりません（cache: true の prune ステップには jq が必要です）"
            exit 1
          fi

          workspace="$(pwd -P)"
          target_dir="${workspace}/target"
          if [ ! -d "${target_dir}" ]; then
            echo "target が存在しないため prune をスキップします"
            exit 0
          fi
          if [ -L "${target_dir}" ]; then
            echo "::error::target が symlink のため prune を中止します"
            exit 1
          fi

          # メンバー package 名 + 全 target 名（lib/bin/test/bench/example）。
          # --no-deps は依存解決・ネットワーク不要（workspace 内のみを見る）。
          raw=()
          while IFS= read -r n; do
            [ -n "${n}" ] && raw+=("${n}")
          done < <(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | .name, (.targets[] | select(.kind | index("custom-build") | not) | .name)' \
            | sort -u)
          if [ "${#raw[@]}" -eq 0 ]; then
            echo "::error::cargo metadata から workspace メンバーを取得できませんでした"
            exit 1
          fi

          # Cargo のパッケージ名は非ASCIIの Unicode 英数字（+ `_`・`-`）も許容する
          # （crates.io 公開時の ASCII 限定は別レイヤーの制約。cargo リファレンス:
          # https://doc.rust-lang.org/cargo/reference/manifest.html#the-name-field）。
          # 許可文字は正規表現メタ文字を含まないため、後段で alt_pkgs / alt_names として
          # 無エスケープのまま正規表現へ埋め込んでも安全（#133 レビュー指摘対応）。
          pkgs=(); names=()
          for n in "${raw[@]}"; do
            if ! jq -n --arg n "${n}" '$n | test("^[\\p{L}\\p{N}_-]+$")' | grep -q '^true$'; then
              echo "::error::想定外の crate / target 名を検出したため prune を中止します"
              echo "名前: ${n}"
              exit 1
            fi
            pkgs+=("${n}")
            names+=("${n}" "${n//-/_}")
          done
          mapfile_pkgs=(); while IFS= read -r n; do mapfile_pkgs+=("${n}"); done < <(printf '%s\n' "${pkgs[@]}" | sort -u)
          pkgs=("${mapfile_pkgs[@]}")
          mapfile_names=(); while IFS= read -r n; do mapfile_names+=("${n}"); done < <(printf '%s\n' "${names[@]}" | sort -u)
          names=("${mapfile_names[@]}")

          alt_pkgs="$(IFS='|'; printf '%s' "${pkgs[*]}")"
          alt_names="$(IFS='|'; printf '%s' "${names[*]}")"
          re_unit="^(${alt_pkgs})-[0-9a-f]{16}$"                 # .fingerprint/ build/（package 名・ハイフンのまま）
          re_dep="^(lib)?(${alt_names})-[0-9a-f]{16}(\..+)?$"    # deps/（target 名・`_` 正規化）
          re_top="^(lib)?(${alt_names})(\.(d|rlib|rmeta|so|a|dylib))?$"  # <profile> 直下の uplift バイナリ（lib prefix・rlib 等の拡張子込み）

          removed=0
          safe_rm() {  # $1=削除対象パス $2=許可される親ディレクトリ（境界チェック用）
            local p="$1" base="$2"
            case "${p}" in
              "${base}"/*) ;;
              *)
                echo "::error::削除対象が想定ディレクトリ配下ではありません"
                echo "${p}"
                exit 1
                ;;
            esac
            if [ -L "${p}" ]; then
              echo "::error::symlink は削除対象にしません"
              echo "${p}"
              exit 1
            fi
            rm -rf -- "${p}"
            removed=$((removed + 1))
          }
          prune_entries() {  # $1=dir $2=regex $3=base（境界チェック用）
            local dir="$1" re="$2" base="$3" e b
            [ -d "${dir}" ] || return 0
            while IFS= read -r -d '' e; do
              b="${e##*/}"
              if [[ "${b}" =~ ${re} ]]; then safe_rm "${e}" "${base}"; fi
            done < <(find "${dir}" -mindepth 1 -maxdepth 1 -print0)
          }
          prune_profile() {  # $1=profile dir（target/debug または target/<triple>/debug）
            local profile="$1"
            [ -d "${profile}" ] || return 0
            if [ -L "${profile}" ]; then
              echo "::error::${profile} が symlink のため prune を中止します"
              exit 1
            fi
            for d in examples incremental; do
              [ -e "${profile}/${d}" ] && safe_rm "${profile}/${d}" "${profile}"
            done
            prune_entries "${profile}/.fingerprint" "${re_unit}" "${profile}"
            prune_entries "${profile}/build" "${re_unit}" "${profile}"
            prune_entries "${profile}/deps" "${re_dep}" "${profile}"
            while IFS= read -r -d '' e; do
              b="${e##*/}"
              if [[ "${b}" =~ ${re_top} ]] || [[ "${b}" == *.d ]]; then safe_rm "${e}" "${profile}"; fi
            done < <(find "${profile}" -mindepth 1 -maxdepth 1 -type f -print0)
          }

          # 既定の target/debug に加え、.cargo/config.toml の build.target 指定時に
          # 生成される target/<triple>/debug のメンバー成果物も prune 対象に含める
          # （#133 レビュー指摘対応。target/debug 固定だとターゲット別ディレクトリの
          # 成果物が縮小対象から漏れ、キャッシュに残ったままになる）。
          profiles=("${target_dir}/debug")
          while IFS= read -r -d '' d; do
            profiles+=("${d}")
          done < <(find "${target_dir}" -mindepth 2 -maxdepth 2 -type d -name debug -print0 2>/dev/null)

          any_profile=0
          for profile in "${profiles[@]}"; do
            if [ -d "${profile}" ]; then
              any_profile=1
              prune_profile "${profile}"
            fi
          done
          if [ "${any_profile}" -eq 0 ]; then
            echo "target/debug が存在しないため prune をスキップします"
            exit 0
          fi

          echo "prune 完了: ${removed} エントリを削除しました"
          echo "対象 package: ${pkgs[*]}"

      # 保存は restore と同じ path・primary key で行う。`cache-save` と exact hit
      # （cache-hit == 'true'。内容が同じため保存しない）の判定は cache-save-decision に
      # まとめ、prune と共有する。条件に status 関数を含めないので、前段の失敗時は保存しない
      - name: Save cargo cache
        if: steps.cache-save-decision.outputs.save == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # --------------------------------------------------
  # cargo test（ユニット・結合・doc test）。
  # 実機依存テストは呼び出し側で #[ignore] 分離されている前提であり、本ジョブでは実行しない。
  # --------------------------------------------------
  test:
    name: cargo test
    runs-on: ${{ inputs.runner-label }}
    timeout-minutes: ${{ inputs.test-timeout-minutes }}
    steps:
      - name: Checkout
        # persist-credentials: false（fmt ジョブと同一方針）。
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Cargo.toml の有無を判定
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "Cargo.toml" ]; then
            echo "has_cargo=true" >> "${GITHUB_OUTPUT}"
          else
            echo "has_cargo=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Cargo.toml が無いため cargo test をスキップしました"
          fi

      - name: インクリメンタルコンパイルを無効化（cache 有効時のみ）
        # cache: true のときだけ CARGO_INCREMENTAL=0 を設定する（Restore cargo cache と
        # 同一条件）。incremental ディレクトリの削除ではなく生成自体の抑止であり、以降の
        # ステップ（toolchain setup・cargo test）に効く。使い捨て runner では復元後の
        # 差分ビルドの恩恵が小さい一方、キャッシュ blob を肥大化させていたため（#132）。
        if: inputs.cache && steps.detect.outputs.has_cargo == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "CARGO_INCREMENTAL=0" >> "${GITHUB_ENV}"

      - name: Setup Rust toolchain
        if: steps.detect.outputs.has_cargo == 'true'
        uses: Fandhe-AI/actions/rust-toolchain-setup@latest

      # target の成果物は rustc の版ごとに別物になるため、key に rustc の版（`rustc -vV` の release・commit-hash）を入れる。
      # 入れないと runner イメージの更新で stable の rustc が変わった後も旧 rustc の blob に
      # exact hit し続け、依存を毎回全再ビルドしたうえ exact hit のため保存もされない。
      # toolchain は rust-toolchain.toml に従うため、Setup Rust toolchain の後に取得する
      - name: rustc の版を取得（cache key 用）
        id: rustc
        if: inputs.cache && steps.detect.outputs.has_cargo == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # ハッシュ計算コマンド（sha256sum）は macOS 等に無いことがあるため使わず、
          # release と commit-hash の行から key 用の文字列を作る（例: 1.99.0-b940084d7c4b）
          info="$(rustc -vV)"
          printf '%s\n' "${info}"
          release="$(printf '%s\n' "${info}" | awk '/^release:/{print $2}')"
          commit="$(printf '%s\n' "${info}" | awk '/^commit-hash:/{print substr($2,1,12)}')"
          hash="${release:-unknown}-${commit:-unknown}"
          if ! printf '%s' "${hash}" | grep -qE '^[A-Za-z0-9._-]+$'; then
            hash=unknown
          fi
          echo "hash=${hash}" >> "${GITHUB_OUTPUT}"

      - name: Restore cargo cache
        # キーの `v4` は rustc の版（上のステップ）を key に入れた空間への切り替えセグメント。
        # restore-keys は同じ rustc の `v4` を優先し、移行期間だけ `v3`（rustc を含まない旧 key。
        # 保存前 prune 済み・#133）にもフォールバックする（cold run を挟まない移行）。`v3` 行は
        # `v3` blob が evict（7 日）された後に削除してよい。`v3` の blob が別の rustc のものだった
        # 場合は依存が再ビルドされるが、新しい `v4` の key で保存し直されるため 1 回で収まる。
        # 版を bump する場合は clippy / test 両ジョブを同時に更新する
        id: cargo-cache
        if: inputs.cache && steps.detect.outputs.has_cargo == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ inputs.cache-key-prefix }}-${{ runner.os }}-test-v4-${{ steps.rustc.outputs.hash }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ inputs.cache-key-prefix }}-${{ runner.os }}-test-v4-${{ steps.rustc.outputs.hash }}-
            ${{ inputs.cache-key-prefix }}-${{ runner.os }}-test-v3-

      - name: cargo test --workspace --all-features
        if: steps.detect.outputs.has_cargo == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cargo test --workspace --all-features

      # 保存するかの判定。下の prune と Save cargo cache はこの出力だけを条件にし、判定を
      # 2 か所に書かない。`cache-save: false`（PR で restore のみ）と primary key への
      # exact hit では保存しないため save=false になる。cache 無効・Cargo.toml 不在・前段の
      # 失敗ではこのステップ自体が skip され、出力が空のため prune・保存も skip される
      - name: cache を保存するか判定
        id: cache-save-decision
        if: inputs.cache && steps.detect.outputs.has_cargo == 'true'
        shell: bash
        env:
          SAVE: ${{ inputs.cache-save && steps.cargo-cache.outputs.cache-hit != 'true' }}
        run: |
          set -euo pipefail
          if [ "${SAVE}" = "true" ]; then
            echo "save=true" >> "${GITHUB_OUTPUT}"
          else
            echo "save=false" >> "${GITHUB_OUTPUT}"
            echo "cache を保存しない run のため、保存前 prune と保存をスキップします"
          fi

      - name: workspace メンバー成果物を prune（cache を保存する run のみ）
        # 保存（下の Save cargo cache）はこの後に走るため、ここで削除した分は
        # 保存対象から外れる。メンバー crate の成果物はソース変更で必ず再ビルドされるため
        # キャッシュ価値がなく、blob を肥大化させる主因だった（#131 計測・#133）。
        # 依存 crate の成果物（deps/ の依存側 rlib・~/.cargo）は残す。
        # prune の目的は保存する blob の縮小だけで、後続に prune 後の target を使うステップは
        # 無い。そのため保存しない run（PR の restore のみ・exact hit）では実行しない
        # （保存の判定は上の cache-save-decision と共有する）。
        # if: always() は付けない（cargo 失敗時は判定ステップも既定の success() 条件で
        # skip され保存しないため、prune を実行する必要がない）。
        if: steps.cache-save-decision.outputs.save == 'true'
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v jq >/dev/null 2>&1; then
            echo "::error::jq が見つかりません（cache: true の prune ステップには jq が必要です）"
            exit 1
          fi

          workspace="$(pwd -P)"
          target_dir="${workspace}/target"
          if [ ! -d "${target_dir}" ]; then
            echo "target が存在しないため prune をスキップします"
            exit 0
          fi
          if [ -L "${target_dir}" ]; then
            echo "::error::target が symlink のため prune を中止します"
            exit 1
          fi

          # メンバー package 名 + 全 target 名（lib/bin/test/bench/example）。
          # --no-deps は依存解決・ネットワーク不要（workspace 内のみを見る）。
          raw=()
          while IFS= read -r n; do
            [ -n "${n}" ] && raw+=("${n}")
          done < <(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | .name, (.targets[] | select(.kind | index("custom-build") | not) | .name)' \
            | sort -u)
          if [ "${#raw[@]}" -eq 0 ]; then
            echo "::error::cargo metadata から workspace メンバーを取得できませんでした"
            exit 1
          fi

          # Cargo のパッケージ名は非ASCIIの Unicode 英数字（+ `_`・`-`）も許容する
          # （crates.io 公開時の ASCII 限定は別レイヤーの制約。cargo リファレンス:
          # https://doc.rust-lang.org/cargo/reference/manifest.html#the-name-field）。
          # 許可文字は正規表現メタ文字を含まないため、後段で alt_pkgs / alt_names として
          # 無エスケープのまま正規表現へ埋め込んでも安全（#133 レビュー指摘対応）。
          pkgs=(); names=()
          for n in "${raw[@]}"; do
            if ! jq -n --arg n "${n}" '$n | test("^[\\p{L}\\p{N}_-]+$")' | grep -q '^true$'; then
              echo "::error::想定外の crate / target 名を検出したため prune を中止します"
              echo "名前: ${n}"
              exit 1
            fi
            pkgs+=("${n}")
            names+=("${n}" "${n//-/_}")
          done
          mapfile_pkgs=(); while IFS= read -r n; do mapfile_pkgs+=("${n}"); done < <(printf '%s\n' "${pkgs[@]}" | sort -u)
          pkgs=("${mapfile_pkgs[@]}")
          mapfile_names=(); while IFS= read -r n; do mapfile_names+=("${n}"); done < <(printf '%s\n' "${names[@]}" | sort -u)
          names=("${mapfile_names[@]}")

          alt_pkgs="$(IFS='|'; printf '%s' "${pkgs[*]}")"
          alt_names="$(IFS='|'; printf '%s' "${names[*]}")"
          re_unit="^(${alt_pkgs})-[0-9a-f]{16}$"                 # .fingerprint/ build/（package 名・ハイフンのまま）
          re_dep="^(lib)?(${alt_names})-[0-9a-f]{16}(\..+)?$"    # deps/（target 名・`_` 正規化）
          re_top="^(lib)?(${alt_names})(\.(d|rlib|rmeta|so|a|dylib))?$"  # <profile> 直下の uplift バイナリ（lib prefix・rlib 等の拡張子込み）

          removed=0
          safe_rm() {  # $1=削除対象パス $2=許可される親ディレクトリ（境界チェック用）
            local p="$1" base="$2"
            case "${p}" in
              "${base}"/*) ;;
              *)
                echo "::error::削除対象が想定ディレクトリ配下ではありません"
                echo "${p}"
                exit 1
                ;;
            esac
            if [ -L "${p}" ]; then
              echo "::error::symlink は削除対象にしません"
              echo "${p}"
              exit 1
            fi
            rm -rf -- "${p}"
            removed=$((removed + 1))
          }
          prune_entries() {  # $1=dir $2=regex $3=base（境界チェック用）
            local dir="$1" re="$2" base="$3" e b
            [ -d "${dir}" ] || return 0
            while IFS= read -r -d '' e; do
              b="${e##*/}"
              if [[ "${b}" =~ ${re} ]]; then safe_rm "${e}" "${base}"; fi
            done < <(find "${dir}" -mindepth 1 -maxdepth 1 -print0)
          }
          prune_profile() {  # $1=profile dir（target/debug または target/<triple>/debug）
            local profile="$1"
            [ -d "${profile}" ] || return 0
            if [ -L "${profile}" ]; then
              echo "::error::${profile} が symlink のため prune を中止します"
              exit 1
            fi
            for d in examples incremental; do
              [ -e "${profile}/${d}" ] && safe_rm "${profile}/${d}" "${profile}"
            done
            prune_entries "${profile}/.fingerprint" "${re_unit}" "${profile}"
            prune_entries "${profile}/build" "${re_unit}" "${profile}"
            prune_entries "${profile}/deps" "${re_dep}" "${profile}"
            while IFS= read -r -d '' e; do
              b="${e##*/}"
              if [[ "${b}" =~ ${re_top} ]] || [[ "${b}" == *.d ]]; then safe_rm "${e}" "${profile}"; fi
            done < <(find "${profile}" -mindepth 1 -maxdepth 1 -type f -print0)
          }

          # 既定の target/debug に加え、.cargo/config.toml の build.target 指定時に
          # 生成される target/<triple>/debug のメンバー成果物も prune 対象に含める
          # （#133 レビュー指摘対応。target/debug 固定だとターゲット別ディレクトリの
          # 成果物が縮小対象から漏れ、キャッシュに残ったままになる）。
          profiles=("${target_dir}/debug")
          while IFS= read -r -d '' d; do
            profiles+=("${d}")
          done < <(find "${target_dir}" -mindepth 2 -maxdepth 2 -type d -name debug -print0 2>/dev/null)

          any_profile=0
          for profile in "${profiles[@]}"; do
            if [ -d "${profile}" ]; then
              any_profile=1
              prune_profile "${profile}"
            fi
          done
          if [ "${any_profile}" -eq 0 ]; then
            echo "target/debug が存在しないため prune をスキップします"
            exit 0
          fi

          echo "prune 完了: ${removed} エントリを削除しました"
          echo "対象 package: ${pkgs[*]}"

      # 保存は restore と同じ path・primary key で行う。`cache-save` と exact hit
      # （cache-hit == 'true'。内容が同じため保存しない）の判定は cache-save-decision に
      # まとめ、prune と共有する。条件に status 関数を含めないので、前段の失敗時は保存しない
      - name: Save cargo cache
        if: steps.cache-save-decision.outputs.save == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # --------------------------------------------------
  # cargo deny check（RUSTSEC アドバイザリ監査・依存ライセンス互換性・レジストリ供給元監査）。
  # deny.toml が無い状態で cargo-deny の組み込み既定を適用してしまわないよう、
  # Cargo.toml と deny.toml の双方が存在する場合のみ実行する。
  # --------------------------------------------------
  deny:
    name: cargo deny check
    runs-on: ${{ inputs.runner-label }}
    timeout-minutes: ${{ inputs.deny-timeout-minutes }}
    steps:
      - name: Checkout
        # persist-credentials: false（fmt ジョブと同一方針）。
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      # deny-checks の入力検証（fail-closed）。空白区切りトークンを閉じた whitelist と
      # 厳密一致で照合し、許容外の値は実行前に失敗させる。検証済みトークンのみを配列へ
      # 詰め直し、後段の cargo deny へは "${checks[@]}" で展開する（元入力文字列を
      # コマンドラインへ非クォートで展開しない）。検証結果は $GITHUB_OUTPUT 経由で
      # 実行ステップへ渡す。
      - name: deny-checks の検証
        id: validate
        env:
          DENY_CHECKS: ${{ inputs.deny-checks }}
        shell: bash
        run: |
          set -euo pipefail
          allowed=(advisories bans licenses sources)
          # read は 1 行しか読まないため、改行区切りで渡された場合に 2 行目以降が
          # 黙って落ちないよう空白へ正規化してから配列化する。
          read -r -a requested <<< "$(printf '%s' "${DENY_CHECKS}" | tr '\n\r\t' '   ')"
          if [ "${#requested[@]}" -eq 0 ]; then
            echo "::error::deny-checks が空です（advisories / bans / licenses / sources から 1 つ以上指定してください）"
            exit 1
          fi
          validated=()
          for check in "${requested[@]}"; do
            ok=false
            for candidate in "${allowed[@]}"; do
              if [ "${check}" = "${candidate}" ]; then
                ok=true
                break
              fi
            done
            if [ "${ok}" = false ]; then
              echo "::error::deny-checks に許容外の値が含まれています（許容: advisories / bans / licenses / sources）"
              echo "指定値: ${check}"
              exit 1
            fi
            validated+=("${check}")
          done
          echo "checks=${validated[*]}" >> "${GITHUB_OUTPUT}"

      - name: Cargo.toml と deny.toml の有無を判定
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "Cargo.toml" ] && [ -f "deny.toml" ]; then
            echo "has_deny=true" >> "${GITHUB_OUTPUT}"
          else
            echo "has_deny=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Cargo.toml または deny.toml が無いため cargo deny をスキップしました"
          fi

      - name: Restore cargo cache
        id: cargo-cache
        if: inputs.cache && steps.detect.outputs.has_deny == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ inputs.cache-key-prefix }}-${{ runner.os }}-deny-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ inputs.cache-key-prefix }}-${{ runner.os }}-deny-

      - name: Setup Rust toolchain
        if: steps.detect.outputs.has_deny == 'true'
        uses: Fandhe-AI/actions/rust-toolchain-setup@latest

      # cargo-deny のバイナリ cache。導入（下の Ensure cargo-deny）は毎回ソースビルドで約 85 秒
      # かかり、deny ジョブの所要時間の大半を占めていた（fandhe-container 実測: ジョブ 96 秒中
      # 84 秒）。key は OS・アーキテクチャ・runner イメージ（ImageOS。self-hosted では unknown）・
      # バージョンで、Cargo.lock に依存しないため PR・main で 1 つを共有する。復元後は Ensure の
      # バージョン完全一致判定で導入がスキップされる。イメージを key に含めるのは、新しい
      # glibc でビルドしたバイナリが古いイメージで動かない場合に、壊れた blob の exact hit が
      # 続いて毎回ソースビルドに戻るのを避けるため
      - name: cargo-deny cache key の決定
        id: deny-bin-key
        if: inputs.cache && steps.detect.outputs.has_deny == 'true'
        shell: bash
        run: |
          set -euo pipefail
          image="${ImageOS:-unknown}"
          if ! printf '%s' "${image}" | grep -qE '^[A-Za-z0-9._-]+$'; then
            image=unknown
          fi
          echo "image=${image}" >> "${GITHUB_OUTPUT}"

      - name: Restore cargo-deny binary
        id: deny-bin
        if: inputs.cache && steps.detect.outputs.has_deny == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-deny
          key: ${{ inputs.cache-key-prefix }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.deny-bin-key.outputs.image }}-cargo-deny-${{ inputs.cargo-deny-version }}

      # 移行元 ci.yml の `cargo install cargo-deny --locked`（バージョン非固定）を
      # バージョン固定・冪等な導入へ置き換える（導入済みなら何もしない）。
      #
      # cargo-tool-install action ではなくインラインで実装している理由:
      # cargo-deny 0.20.x の MSRV は 1.88.0 であり、呼び出し側の rust-toolchain.toml が
      # それより古いチャネルを固定していると、`cargo install` が呼び出し側 toolchain で
      # ビルドされて失敗する（rustup は cwd/祖先の rust-toolchain.toml を解決するため、
      # ステップ順を入れ替えても回避できない）。そのためビルド専用に stable を別途導入し、
      # RUSTUP_TOOLCHAIN=stable を「そのコマンドだけ」に付与してビルドする。
      # 生成されるバイナリは ~/.cargo/bin に置かれ toolchain 非依存で、後段の
      # `cargo deny --locked check` は呼び出し側 toolchain のまま実行される
      # （$GITHUB_ENV へは書かないので stable が後続ステップへ漏れない）。
      # stable は常に最新安定版であり MSRV 1.88.0 を満たす。
      - name: Ensure cargo-deny (build with dedicated stable toolchain)
        if: steps.detect.outputs.has_deny == 'true'
        env:
          VERSION: ${{ inputs.cargo-deny-version }}
        shell: bash
        run: |
          set -euo pipefail

          # 入力の形式検証（fail-closed）。env 経由の値のみを使い、引数位置へ渡す前に
          # 許容文字を semver 形式へ制限する。
          if ! printf '%s' "${VERSION}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+([0-9A-Za-z.+-]*)?$'; then
            echo "::error::cargo-deny-version が不正です（semver 形式のみ許容）"
            echo "指定値: ${VERSION}"
            exit 1
          fi

          get_installed_version() {
            cargo deny --version 2>/dev/null \
              | head -n 1 \
              | grep -oE '[0-9]+\.[0-9]+\.[0-9]+[0-9A-Za-z.+-]*' \
              | head -n 1 \
              || true
          }

          installed="$(get_installed_version)"
          if [ "${installed}" = "${VERSION}" ]; then
            echo "cargo-deny ${VERSION} は導入済み。インストールをスキップします"
            exit 0
          fi

          echo "cargo-deny@${VERSION} をインストールします（現在: ${installed:-未導入}）"
          # 明示的に stable を導入してから使う（rustup の自動インストール挙動に依存しない）。
          rustup toolchain install stable --profile minimal
          # --force: cargo のインストール記録（.crates2.json）に期待バージョンが登録済みなのに
          # PATH 上の cargo-deny が別バージョンを返す状態不整合の runner では、--force なしだと
          # `Ignored package ... is already installed` でバイナリが更新されず、後段の厳密一致
          # 検証に恒久的に落ち続ける（self-hosted runner で実測）。このパスへ入るのは
          # バージョン不一致時のみなので、一致時の冪等スキップ（上の early return）は
          # 従来どおり維持される。
          RUSTUP_TOOLCHAIN=stable cargo install --locked --force "cargo-deny@${VERSION}"

          # インストール後の厳密一致検証（fail-closed）。
          installed="$(get_installed_version)"
          if [ "${installed}" != "${VERSION}" ]; then
            echo "::error::インストール後の cargo-deny のバージョンが期待値と一致しません"
            echo "期待: ${VERSION} / 実際: ${installed:-取得失敗}"
            exit 1
          fi
          echo "cargo-deny ${VERSION} のインストールが完了しました"

      # 導入直後に保存する（後段の cargo deny check が失敗しても、導入済みのバイナリは再利用できる）
      - name: Save cargo-deny binary
        if: inputs.cache && inputs.cache-save && steps.detect.outputs.has_deny == 'true' && steps.deny-bin.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-deny
          key: ${{ steps.deny-bin.outputs.cache-primary-key }}

      # --locked で Cargo.lock の意図しない書き換え・runner 汚染を防止する。
      # CHECKS は直前ステップで whitelist 検証済みのトークン列（意図的に非クォート展開）。
      - name: cargo deny check
        if: steps.detect.outputs.has_deny == 'true'
        env:
          CHECKS: ${{ steps.validate.outputs.checks }}
        shell: bash
        run: |
          set -euo pipefail
          read -r -a checks <<< "${CHECKS}"
          cargo deny --locked check "${checks[@]}"

      # 保存は restore と同じ path・primary key で行う。exact hit（cache-hit == 'true'）では
      # 内容が同じため保存しない。条件に status 関数を含めないので、前段の失敗時は保存しない
      - name: Save cargo cache
        if: inputs.cache && inputs.cache-save && steps.detect.outputs.has_deny == 'true' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # --------------------------------------------------
  # 完遂判定用の集約ジョブ。branch protection / ruleset の required status check には
  # 本ジョブ（呼び出し側から見た名前は `<呼び出し側 job id> / rust-base-ci-complete`）を
  # 指定すればよい。呼び出し側が独自ジョブを持つ場合、本ジョブからは参照できないため
  # 呼び出し側でも同型の集約ジョブが必要（README の注意事項参照）。
  # --------------------------------------------------
  rust-base-ci-complete:
    name: rust-base-ci-complete
    runs-on: ${{ inputs.runner-label }}
    # 失敗・スキップ時にも必ず実行して fail-closed で判定する
    # （bare needs は skipped も success 扱いになるため、明示的に result を検査する）。
    if: ${{ always() }}
    needs: [fmt, clippy, test, deny]
    timeout-minutes: 5
    steps:
      - name: 完遂判定（全 needs ジョブが success であること）
        env:
          RESULT_FMT: ${{ needs.fmt.result }}
          RESULT_CLIPPY: ${{ needs.clippy.result }}
          RESULT_TEST: ${{ needs.test.result }}
          RESULT_DENY: ${{ needs.deny.result }}
        shell: bash
        run: |
          set -euo pipefail
          ok=1
          for pair in "fmt:${RESULT_FMT}" "clippy:${RESULT_CLIPPY}" "test:${RESULT_TEST}" "deny:${RESULT_DENY}"; do
            name="${pair%%:*}"
            result="${pair#*:}"
            if [ "${result}" != "success" ]; then
              echo "NG: ${name} = ${result}"
              ok=0
            fi
          done
          if [ "${ok}" -ne 1 ]; then
            echo "一部ジョブが success ではありません" >&2
            exit 1
          fi
          echo "全ジョブ success"
