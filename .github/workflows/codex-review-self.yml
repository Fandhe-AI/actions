# 自リポジトリの PR へ codex-review を適用する wrapper（イシュー #46）。
#
# `.github/workflows/codex-review.yml` は reusable 定義本体（`on: workflow_call`）で
# あり、そのままでは本リポジトリ自身の PR にレビューが走らない。そのため、他の
# 呼び出し側リポジトリと同じ薄い wrapper を別ファイル名で追加して自己適用する。
# 内容は public リポジトリ向けテンプレート（codex-review/templates/codex-review.public.yml）
# 相当。呼び出し先も SHA 固定とする（自リポジトリでも `@main` 参照はしない。
# wrapper と reusable 本体の更新タイミングを分離し、テンプレートと同じ参照規約を守る）。
#
# 有効化のスイッチは呼び出し先 reusable workflow の fail-closed ガードに従う:
# Actions variable `CODEX_HOME_DIR` が未設定の間は全ジョブが skip される
# （runner 側の準備が済むまでレビューは実行されない）。
name: Codex PR review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

# reusable workflow のトップレベル concurrency は機能しないため呼び出し側で設定する
concurrency:
  group: codex-review-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  codex-review:
    # 呼び出し先は本リポジトリのコミット SHA で固定する（@main 不可）
    uses: Fandhe-AI/actions/.github/workflows/codex-review.yml@5982e2f502a19effc36a7b161660b5a4ea17b886 # main
    permissions:
      contents: read
      pull-requests: write
    # codex ジョブは runner-label（既定値 codex）のまま、public リポジトリでも self-hosted な
    # codex 専用 runner を使う。これは組織 runner 方針で認められた唯一の例外であり、
    # fork PR では workflow 側が fail-closed で実行を拒否する。ここでは指定しない。
    with:
      # post-feedback-runner-label の既定値は self-hosted であり、public リポジトリでは
      # 組織 runner 方針（public は GitHub ホステッド）に反する。資格情報に触れない
      # コメント投稿ジョブなので、必ず ubuntu-latest を明示的に渡すこと。
      # 詳細は docs/runner-policy.md「3. 例外: codex-review」を参照。
      post-feedback-runner-label: ubuntu-latest
