name: Update external sources (reusable)

# 外部ソース（submodule 参照 / エージェントスキル）の定期更新を束ねた reusable workflow。
# Fandhe-AI/agent-cli-skills の update-external.yml で構築・強化した内容（同リポジトリの
# イシュー #244 / #247 / #250 / #251）を workflow_call 化して移設したもの。
# 呼び出し側リポジトリは SHA 固定の薄い wrapper から使う:
#
#   jobs:
#     update-external:
#       uses: Fandhe-AI/actions/.github/workflows/update-external.yml@<SHA> # main
#       secrets:
#         SUBMODULE_PAT: ${{ secrets.SUBMODULE_PAT }}
#         SKILLS_PAT: ${{ secrets.SKILLS_PAT }}
#
# 導入手順と wrapper テンプレートは update-external/README.md を参照。
#
# --------------------------------------------------------------------------
# なぜ reusable workflow 化したか（agent-cli-skills イシュー #259）
# --------------------------------------------------------------------------
# skills-update が下流へ配布するのは `.agents/skills/**` と `skills-lock.json` だけで、
# `.github/workflows/**` は配布対象外である。そのため本ファイルの強化を下流 21 リポへ
# 届ける手段が「全リポへの手 push」しか無く、実際に各リポのテンプレートが乖離した
# （2026-08-16 実測で persist-credentials: false は 22 リポ中 4 リポのみ、
# auto-merge-immediate-fallback の fail-open が 19 リポ）。
#
# reusable 化すると下流が持つのは wrapper 1 ファイルだけになり、強化はこのファイルの
# 更新だけで全リポへ届く（wrapper の pin SHA 更新は別途必要。README の「pin SHA の
# 更新」節を参照）。
#
# --------------------------------------------------------------------------
# 呼び出し側の差分をどこで吸収するか
# --------------------------------------------------------------------------
# 下流には正当なリポ固有差分が実在するため、全置換ではなく input で吸収する:
#
# - runner: rust-ai-library は public 化に伴い ubuntu-latest、yadori は self-hosted。
#   → `runner-json` input（呼び出し側で vars.UPDATE_EXTERNAL_RUNNER を解決して渡す）
# - submodule ジョブの要否: yadori は .gitmodules を持つが submodule 更新は行わない
#   （pin 固定運用）。`.gitmodules` の有無による自動 skip だけでは
#   「ファイルはあるが更新したくない」を表現できない。
#   → `enable-submodule` input
# - auto-merge の ON/OFF と allowlist: 組織変数で集中管理している。
#   → `submodule-auto-merge` / `skills-auto-merge` ほかの input
#
# vars コンテキストは called workflow 内でも呼び出し側リポジトリ／組織の変数へ解決される
# （GitHub Docs「Reusing workflow configurations」）が、本ファイルは vars を一切参照せず
# すべて input で受け取る。auto-merge の ON/OFF はマージ可否を左右する設定であり、
# 実効値が呼び出し側のファイルを読むだけで確定することを優先した（コンテキスト解決の
# 仕様変更に依存させない）。
#
# --------------------------------------------------------------------------
# 外部 action の SHA 検証記録（検証日: 2026-08-16、移設時に再確認）
# --------------------------------------------------------------------------
# 本ファイルで uses に指定した全 SHA について、正規のリリースタグ / 正当な
# upstream コミットと一致することを GitHub API で実測確認した。検証方法と結果:
#
#   actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
#     `GET /repos/actions/checkout/git/ref/tags/v6.0.3` → annotated tag object
#     9f698171ed81b15d1823a05fc7211befd50c8ae0 を取得し、
#     `GET /repos/actions/checkout/git/tags/9f69817...` で dereference した結果の
#     commit SHA が df4cb1c... と一致。すなわち正規リリース v6.0.3 のタグ pin。
#
#   actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
#     `GET /repos/actions/setup-node/git/ref/tags/v6.4.0` → lightweight tag が
#     直接 commit 48b55a0... を指しており一致。すなわち正規リリース v6.4.0 の
#     タグ pin。
#
#   Fandhe-AI/actions@fed9c07d98367f77e5e2b63bca38843f46feee96
#     `GET /repos/Fandhe-AI/actions/compare/fed9c07...main` → status "ahead",
#     ahead_by=7, behind_by=0。すなわち fed9c07 は main の祖先。タグ未公開のため
#     main 追従の SHA pin となる。本ファイルは同一リポジトリ内にあるが、composite
#     action の参照は移設元と同じく SHA 固定のままとする（reusable workflow 本体の
#     更新と composite action の更新タイミングを分離するため）。
#
# 上記 2 つの actions/* はブランチ追従ではなくリリースタグ pin であるため、
# uses 行末の注記は追従元タグ（`# v6.0.3` / `# v6.4.0`）とする。ここへ `# main` と
# 書くと「main の先頭を追いかけて SHA を更新する」という誤った更新方針を示唆する。
# `# main` を付けるのはタグ未公開で実際に main 追従となる Fandhe-AI/actions の 2 行のみ。
# --------------------------------------------------------------------------

on:
  workflow_call:
    inputs:
      target:
        description: >
          更新対象。all / submodule / skill のいずれか。呼び出し側の schedule 起動では
          all を渡す。値域外は validate-inputs ジョブが fail-closed で失敗させる
          （wrapper 側の workflow_dispatch input も choice 型にして値域を固定すること）。
        type: string
        required: false
        default: all
      runner-json:
        description: >
          runs-on へ渡す JSON リテラル。単一ラベルは "ubuntu-latest" のように前後の
          二重引用符ごと、複数ラベルは ["self-hosted","Linux"] と指定する。素の
          self-hosted（引用符なし）は JSON として不正で fromJSON が失敗し workflow
          全体が起動しなくなる。複数ラベルを推奨する理由は、単一の self-hosted ラベルが
          OS を限定せず Windows ランナーへ割り当てられうるため（後続 run が既定の
          PowerShell で実行され、POSIX シェル構文と composite action の bash 前提が壊れる）。
        type: string
        required: false
        default: '"ubuntu-latest"'
      base-branch:
        description: >
          更新対象ブランチ。checkout の ref・.gitmodules の存在判定・composite action の
          base-branch すべてに同じ値を使う（判定対象と更新対象がずれると誤 skip / 誤実行になる）。
        type: string
        required: false
        default: main
      enable-submodule:
        description: >
          submodule 更新ジョブを有効にするか。.gitmodules を持つが pin 固定運用のため
          自動更新したくないリポジトリは false を渡す（.gitmodules の有無による自動 skip
          だけでは「ファイルはあるが更新しない」を表現できないため）。
        type: boolean
        required: false
        default: true
      enable-skills:
        description: 'エージェントスキル更新ジョブを有効にするか'
        type: boolean
        required: false
        default: true
      submodule-auto-merge:
        description: >
          submodule 更新 PR の auto-merge を有効にするか（'true' / 'false' の文字列）。
          composite action 側は未設定 (null/空) を有効と解釈する非対称設計のため、
          呼び出し側で vars を解決したうえで明示的な文字列を渡す。
        type: string
        required: false
        default: 'false'
      submodule-auto-merge-allowlist:
        description: 'submodule 更新 PR の auto-merge を許可する対象の allowlist'
        type: string
        required: false
        default: ''
      skills-auto-merge:
        description: 'スキル更新 PR の auto-merge を有効にするか（true / false の文字列）'
        type: string
        required: false
        default: 'false'
      skills-auto-merge-allowlist:
        description: 'スキル更新 PR の auto-merge を許可する対象の allowlist'
        type: string
        required: false
        default: ''
    secrets:
      SUBMODULE_PAT:
        description: >
          submodule の fetch・push・PR 作成に使う書き込み権限付き PAT。
          SKILLS_PAT 未設定時はスキル更新ジョブでも流用する。
        required: false
      SKILLS_PAT:
        description: 'スキル更新の push・PR 作成に使う書き込み権限付き PAT（未設定時は SUBMODULE_PAT を流用）'
        required: false

# secrets: inherit ではなく上記 2 種を明示宣言している。本 workflow は public リポジトリに
# 置かれ、書き込み権限付き PAT を扱うため、渡される資格情報の面を列挙して固定する。

# 注意: reusable workflow のトップレベル concurrency は機能しないため、呼び出し側 wrapper で
# `concurrency: { group: update-external, cancel-in-progress: false }` を設定すること。

jobs:
  # --------------------------------------------------
  # 入力値域の検証（fail-closed ゲート）
  # --------------------------------------------------
  # target が all / submodule / skill 以外だと、両更新ジョブの if が false になり
  # workflow 全体が「成功したのに何も更新していない」状態で終わる。wrapper 側の
  # choice 型は推奨にすぎず、reusable workflow は別の caller からも任意の文字列を
  # 受け取れるため、値域外を明示的に失敗させる。
  #
  # 両更新ジョブは本ジョブを needs に取るため、検証が落ちれば更新は実行されない
  # （ジョブの if には状態関数を含めていないので、needs 失敗時は skip される）。
  validate-inputs:
    name: Validate inputs
    # 更新ジョブと同じランナーを使う（組織 runner 方針の分岐を 1 箇所に保つため）。
    runs-on: ${{ fromJSON(inputs.runner-json) }}
    timeout-minutes: 5
    # 何もチェックアウトせず API も呼ばないため権限は不要。
    permissions: {}
    steps:
      - name: Validate target
        env:
          TARGET: ${{ inputs.target }}
        shell: bash
        run: |
          set -euo pipefail
          case "${TARGET}" in
            all | submodule | skill)
              echo "::notice::target の値域チェックを通過した。"
              ;;
            *)
              # 受け取った値は workflow command 行にもログにも出さない
              # （run ステップの出力は workflow command として解釈されるため、
              #   外部由来の値を流すと注入経路になる）。指定値は起動時の
              #   inputs 表示で確認する。
              echo "::error::target の値が不正。all / submodule / skill のいずれかを指定すること。"
              exit 1
              ;;
          esac

  # --------------------------------------------------
  # submodule 参照の更新 (Fandhe-AI/actions/submodule-update)
  # --------------------------------------------------
  # 前提の確認事項: .gitmodules を持たないリポジトリでは、先頭の存在判定ステップが
  # 以降の全ステップ（PAT 検証・checkout・更新）を skip し、本ジョブは成功で終わる。
  # 更新対象が無いだけの既定構成を日次で失敗させないための明示的な skip であり、
  # 「更新対象が無ければ何もしない」契約はここで担保される。
  # 一方、既に submodule を持つリポジトリ（docs / spec を特定コミットへ
  # pin 固定している構成など）では、日次の submodule 自動更新が pin 運用と
  # 衝突しうる。そうしたリポジトリは enable-submodule: false を渡してジョブごと
  # 無効化する（存在判定では区別できないため）。
  submodule:
    name: Update submodule references
    needs: validate-inputs
    if: ${{ inputs.enable-submodule && contains(fromJSON('["all", "submodule"]'), inputs.target) }}
    # 実行ランナーは呼び出し側が runner-json で指定する。値の書式は input の
    # description を参照（必ず JSON リテラル）。`||` を fromJSON の外（文字列側）へ
    # 置く設計を移設元から引き継いでいる: 配列値の真偽判定は GitHub Actions 式仕様として
    # 明文化されておらず、`X && fromJSON(X) || 'ubuntu-latest'` 形式だと self-hosted 指定が
    # 黙って ubuntu-latest へフォールバックする（fail-open する）恐れがあるため、
    # 既定値は input 側の default で与え、ここでは fromJSON のみを行う。
    runs-on: ${{ fromJSON(inputs.runner-json) }}
    # 外部取得・submodule 更新・PR 作成の実処理量に見合う上限。ネットワーク
    # ハングやリモート応答待ちでランナーを占有し続けるのを防ぐ。
    timeout-minutes: 10
    # 最小権限。書き込み（push / PR 作成）は下記ステップへ明示的に渡す PAT だけで
    # 行うため、GITHUB_TOKEN に write は与えない。write を与えると composite action
    # を含む全ステップから書き込み可能な github.token が参照でき、PAT の fail-closed
    # ガードを迂回できる余分な資格情報経路になる。read が要るのは先頭の存在判定
    # ステップ（Contents API の読み取り）だけ。
    permissions:
      contents: read
    steps:
      # .gitmodules の有無を checkout より前に判定する。無ければ以降の全ステップを
      # skip し、ジョブは失敗ではなく成功で終える（更新対象が無いだけの既定構成を
      # 日次で失敗させないため）。
      #
      # checkout 後に判定できない理由: それでは PAT 検証を checkout より後ろへ
      # 動かすことになり、actions/checkout が token 空文字時に暗黙で GITHUB_TOKEN
      # へフォールバックする分だけ fail-closed が名目だけになる。よって checkout
      # せずに Contents API で直接参照する。
      #
      # ここで GITHUB_TOKEN を使うのは存在判定という読み取り専用用途に限られ、
      # fail-open ではない。廃止したのは push / PR 作成に使う「書き込み用の
      # GITHUB_TOKEN フォールバック」であり、本ステップはそれに当たらない。
      # .gitmodules が存在する場合は従来どおり PAT 必須のまま。
      #
      # github コンテキストは reusable workflow 内でも常に呼び出し側に紐づくため、
      # github.repository は呼び出し側リポジトリを指す（GitHub Docs）。
      - name: Detect .gitmodules
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BASE_BRANCH: ${{ inputs.base-branch }}
        # 他ステップと同様、self-hosted / Windows 割り当て時の既定 PowerShell を
        # 避けるため POSIX シェルを明示する。
        shell: bash
        run: |
          set -euo pipefail
          # ブランチ名は URL パスへ埋め込むため、クエリ文字列として安全になるよう
          # --data-urlencode に相当する形で渡す。release/1.0 のような / を含む名前でも
          # ref パラメータとして正しく解釈させる。
          # gh api は HTTP エラーを一律 exit 1 に潰すため、404（対象なし）と
          # 通信・権限エラーを区別できない。HTTP status を直接取る curl を使う。
          curl_status=0
          http_code=$(curl -sS -o /dev/null -w '%{http_code}' -G \
            --data-urlencode "ref=${BASE_BRANCH}" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${REPO}/contents/.gitmodules") || curl_status=$?
          if [ "${curl_status}" -ne 0 ]; then
            echo "::error::.gitmodules の存在確認に失敗（curl 終了コード ${curl_status}）。"
            exit 1
          fi
          # 200 / 404 のみを判定結果として受理する allowlist 方式。403・5xx 等を
          # 「.gitmodules 無し」と誤読して黙って skip すると、本来動くべき更新が
          # 無告知に止まるため、想定外 status は必ず失敗させる。
          case "${http_code}" in
            200)
              echo "present=true" >> "${GITHUB_OUTPUT}"
              echo "::notice::.gitmodules を検出。submodule 更新を実行する。"
              ;;
            404)
              # 404 は「.gitmodules が無い」と「ref 自体が存在しない」の
              # 両方で返る。後者を no-op と誤読すると、既定ブランチが base-branch と
              # 異なるリポジトリで更新が黙って止まる（従来は checkout が
              # `couldn't find remote ref` で明示的に失敗していた）。
              # 応答本文の文字列照合は脆いため、ref の解決可否を別途問い合わせて
              # 判別し、解決できない場合は skip せず失敗させる。
              ref_status=0
              ref_code=$(curl -sS -o /dev/null -w '%{http_code}' \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "${GITHUB_API_URL}/repos/${REPO}/commits/${BASE_BRANCH}") || ref_status=$?
              if [ "${ref_status}" -ne 0 ] || [ "${ref_code}" != "200" ]; then
                # base-branch は呼び出し側から渡る入力であり、workflow command 行
                # （`::error::` 等）へ展開すると細工した値で workflow command を
                # 注入できる。値はログへも出さず（run ステップの出力は stdout/stderr
                # とも workflow command として解釈されるため）、指定値は起動時の
                # inputs 表示で確認する。
                echo "::error::base-branch に指定されたブランチを ref として解決できない（curl ${ref_status} / HTTP ${ref_code}）。呼び出し側 wrapper の base-branch を確認すること。"
                exit 1
              fi
              echo "present=false" >> "${GITHUB_OUTPUT}"
              echo "::notice::.gitmodules 無しのため submodule 更新は no-op（skip）。"
              ;;
            *)
              echo "::error::.gitmodules の存在確認が想定外の HTTP ${http_code} を返した。"
              exit 1
              ;;
          esac

      # PAT 未設定のまま後続へ進むと checkout の token が空文字となり、
      # actions/checkout は暗黙に GITHUB_TOKEN へフォールバックする。それでは
      # fail-open のままなので、checkout より前に明示的に fail-closed させる。
      # 更新対象が存在する場合にのみ要求する（対象なしは上の判定で skip 済み）。
      - name: Verify PAT is configured
        if: steps.detect.outputs.present == 'true'
        env:
          PAT: ${{ secrets.SUBMODULE_PAT }}
        # self-hosted ランナー（特に Windows 割り当て時）の既定シェルは
        # PowerShell であり、下記の POSIX シェル構文が解釈できない。
        # 呼び出す composite action も bash 前提のため明示的に固定する。
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${PAT}" ]; then
            msg="SUBMODULE_PAT が未設定（wrapper の secrets: で渡されていない可能性）。"
            msg="${msg}GITHUB_TOKEN へのフォールバックは廃止済み"
            msg="${msg}（bot 作成 PR が pull_request workflow を発火させず"
            msg="${msg}必須チェック未実行で恒久 BLOCKED になるため。PR #176 の実障害）。"
            msg="${msg}リポジトリ or org の Secrets に SUBMODULE_PAT を登録し、"
            msg="${msg}wrapper の secrets: で本 workflow へ渡すこと。"
            echo "::error::${msg}"
            exit 1
          fi

      - name: Checkout
        if: steps.detect.outputs.present == 'true'
        # actions/checkout v6.0.3（リリースタグ pin。SHA 検証記録はファイル冒頭）
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # base-branch 固定のため、workflow_dispatch で非既定ブランチから
          # 起動された場合でも常に同じブランチを checkout し、他ブランチのツリー混入を防ぐ。
          # 上の Detect .gitmodules の ref と一致させること。
          ref: ${{ inputs.base-branch }}
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.SUBMODULE_PAT }}

      - name: Update submodules and open PR
        if: steps.detect.outputs.present == 'true'
        # Fandhe-AI/actions はタグ未公開のため main 追従の最新コミット SHA に固定
        # する（fed9c07 が main の祖先であることを compare API で確認済み。
        # 検証記録はファイル冒頭）。行末の `# main` が追従元ブランチを示す。
        uses: Fandhe-AI/actions/submodule-update@fed9c07d98367f77e5e2b63bca38843f46feee96 # main
        with:
          token: ${{ secrets.SUBMODULE_PAT }}
          base-branch: ${{ inputs.base-branch }}
          branch-prefix: chore/submodule-update
          commit-message: 'chore: submodule を最新に更新'
          pr-title: 'chore: submodule を最新に更新'
          pr-labels: 'dependencies,automated'
          # auto-merge の ON/OFF。composite action 側は未設定 (null/空) を有効と解釈する
          # 非対称設計のため、呼び出し側で vars を解決した明示的な文字列を受け取り、
          # ここでそのまま渡す（オプトイン運用）。
          auto-merge: ${{ inputs.submodule-auto-merge }}
          auto-merge-allowlist: ${{ inputs.submodule-auto-merge-allowlist }}
          auto-merge-strategy: squash
          # action 側の既定は 'true'。その場合、リポジトリの Allow auto-merge が
          # 無効などで `gh pr merge --auto` が失敗すると、必須チェックの完了を待たず
          # 即時マージへフォールバックする。安全性を branch protection が常に正しく
          # 設定されていることだけに依存させる fail-open な構成になるため明示的に
          # 無効化する（auto-merge が使えない環境では、マージせず人間へ委ねる）。
          # これは呼び出し側で上書きできない固定値とする（fail-open を各リポジトリの
          # 設定ミスで復活させないため）。
          auto-merge-immediate-fallback: 'false'

  # --------------------------------------------------
  # Skills の更新 (Fandhe-AI/actions/skills-update)
  # --------------------------------------------------
  # submodule ジョブのような「対象なしなら skip」の事前判定を本ジョブに入れて
  # いないのは意図的である。submodule では .gitmodules の不在が「更新対象なし」の
  # 完全な述語になる（git が走査する対象そのものが無い）。一方 skills には同等の
  # 事前判定材料が無い。skills-lock.json の不在は「更新対象なし」を意味せず、
  # skills-update 側は lock 不在時に `::warning::skills-lock.json が見つかりません`
  # を出して `{}` を before として処理を続行し、`npx skills` は導入済みスキル
  # ディレクトリを対象に更新する。したがって skills-lock.json で門番すると、
  # 本来成功する更新を無告知の skip に変えてしまう（fail-open の別形態）。
  # 対称性より「黙って止まらないこと」を優先し、本ジョブは PAT 必須のままとする。
  skills:
    name: Update agent skills
    needs: validate-inputs
    if: ${{ inputs.enable-skills && contains(fromJSON('["all", "skill"]'), inputs.target) }}
    # 実行ランナーは呼び出し側が runner-json で指定する。書式は input の description を参照。
    runs-on: ${{ fromJSON(inputs.runner-json) }}
    # npx skills のダウンロード・全スキル更新・PR 作成の実処理量に見合う上限。
    # submodule ジョブより取得対象が多いため長めに取る。
    timeout-minutes: 15
    # 最小権限。理由は submodule ジョブ側の注記を参照（書き込みは PAT のみで行い、
    # GITHUB_TOKEN に write を与えると PAT の fail-closed ガードを迂回できる経路が
    # 増えるため）。
    permissions:
      contents: read
    steps:
      # PAT 未設定のまま後続へ進むと checkout の token が空文字となり、
      # actions/checkout は暗黙に GITHUB_TOKEN へフォールバックする。それでは
      # fail-open のままなので、checkout より前に明示的に fail-closed させる。
      - name: Verify PAT is configured
        env:
          PAT: ${{ secrets.SKILLS_PAT || secrets.SUBMODULE_PAT }}
        # self-hosted ランナー（特に Windows 割り当て時）の既定シェルは
        # PowerShell であり、下記の POSIX シェル構文が解釈できない。
        # 呼び出す composite action も bash 前提のため明示的に固定する。
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${PAT}" ]; then
            msg="SKILLS_PAT / SUBMODULE_PAT がいずれも未設定（wrapper の secrets: で"
            msg="${msg}渡されていない可能性）。GITHUB_TOKEN への"
            msg="${msg}フォールバックは廃止済み（bot 作成 PR が pull_request"
            msg="${msg} workflow を発火させず必須チェック未実行で恒久 BLOCKED に"
            msg="${msg}なるため。PR #176 の実障害）。リポジトリ or org の Secrets に"
            msg="${msg} SKILLS_PAT を登録し、wrapper の secrets: で渡すこと。"
            echo "::error::${msg}"
            exit 1
          fi

      - name: Checkout
        # actions/checkout v6.0.3（リリースタグ pin。SHA 検証記録はファイル冒頭）
        # SKILLS_PAT 未設定時は org 共通の SUBMODULE_PAT を流用する。GITHUB_TOKEN
        # までフォールバックすると bot 作成 PR が pull_request workflow を発火させず
        # 必須チェック未実行で BLOCKED になる（PR #176 の障害）ため、
        # フォールバック連鎖は PAT 2 種で打ち止めとし、未設定なら上記ガードで落とす。
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # base-branch 固定の理由は submodule ジョブ側の注記を参照。
          ref: ${{ inputs.base-branch }}
          fetch-depth: 0
          token: ${{ secrets.SKILLS_PAT || secrets.SUBMODULE_PAT }}
          # 既定の true は書き込み PAT を .git/config の資格情報として残すため、
          # 後続で走る外部 npm パッケージ (`npx skills`) とその依存が本リポへの
          # push 権限を握れてしまう。skills-update は push 前に origin を自前の
          # AUTH_URL へ張り替える実装（pin 先 action.yml の Commit and push branch
          # ステップで実測確認）なので、資格情報を残さなくても push は成立する。
          # submodule ジョブ側は private submodule の fetch に checkout の資格情報を
          # 使うため既定のままとする（対称化しないこと）。
          persist-credentials: false

      - name: Setup Node.js
        # actions/setup-node v6.4.0（リリースタグ pin。SHA 検証記録はファイル冒頭）
        # skills-update が使う npx skills のため node を固定する。
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          # メジャー指定は解決先パッチ版が日々変動し再現性がないため、実在する
          # パッチ版へ固定する。24.19.0 は Node.js 24 系 (LTS Krypton) の最新パッチ
          # （nodejs.org/dist/index.json で 2026-08-03 リリースを実測確認、2026-08-16）。
          #
          # 20 系 (Iron) は 2026-08-16 時点で EOL に達しておりセキュリティ修正を
          # 受けられない。外部パッケージを取得・実行し書き込み権限付き PAT で PR を
          # 作成する定期ジョブで EOL ランタイムを使わないため、サポート中の LTS へ
          # 更新した。メジャー更新時は EOL 到達前に同様の更新を行うこと。
          #
          # 呼び出し側で上書きできない固定値とする。ランタイムのサポート状況は
          # リポジトリ固有の事情ではなく、集中管理して一斉に上げるべき項目のため。
          node-version: '24.19.0'

      - name: Update skills and open PR
        # Fandhe-AI/actions はタグ未公開のため main 追従の最新コミット SHA に固定
        # する（fed9c07 が main の祖先であることを compare API で確認済み。
        # 検証記録はファイル冒頭）。行末の `# main` が追従元ブランチを示す。
        uses: Fandhe-AI/actions/skills-update@fed9c07d98367f77e5e2b63bca38843f46feee96 # main
        with:
          token: ${{ secrets.SKILLS_PAT || secrets.SUBMODULE_PAT }}
          # source-token 省略時は token（書き込み PAT）が流用され、`npx skills` 実行
          # 環境の GH_TOKEN / GITHUB_TOKEN と git の insteadOf 設定へ注入される。
          # スキルソースは全て public のため取得に書き込み権限は不要で、read-only の
          # github.token を明示して資格情報の境界を絞る。private ソースを増やす場合は
          # ここを専用の read-only PAT に差し替えること。
          source-token: ${{ github.token }}
          base-branch: ${{ inputs.base-branch }}
          branch-prefix: chore/skills-update
          commit-message: 'chore: エージェントスキルを最新に更新'
          pr-title: 'chore: エージェントスキルを最新に更新'
          pr-labels: 'dependencies,automated'
          # skills CLI のバージョン固定。latest 追従だと上流リリースで挙動が
          # 無告知に変わるため明示する。1.5.22 は固定時点の npm latest と同一
          # （`npm view skills version` → 1.5.22 を 2026-08-16 に実測）。
          # input 名は pin 先 SHA の action.yml で実在確認済み（未知の input は
          # 警告のみで job が緑のまま素通りし固定が無効化されるため要検証）。
          # node-version と同じく集中管理項目とし、呼び出し側では上書きさせない。
          skills-version: '1.5.22'
          # auto-merge の ON/OFF。理由は submodule ジョブ側の注記を参照。
          auto-merge: ${{ inputs.skills-auto-merge }}
          auto-merge-allowlist: ${{ inputs.skills-auto-merge-allowlist }}
          auto-merge-strategy: squash
          # 即時マージへのフォールバックを無効化する理由は submodule ジョブ側の
          # 注記を参照（必須チェックを待たないマージ経路を作らないため）。
          # 呼び出し側で上書きできない固定値とする。
          auto-merge-immediate-fallback: 'false'
